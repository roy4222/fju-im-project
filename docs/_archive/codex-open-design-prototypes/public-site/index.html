<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="輔大資管系專題網站公開前台的三方向拋棄式 UI 原型。">
  <title>公開前台 UI Prototype｜輔大資管系專題網站</title>
  <style>
    :root {
      --brand-navy: #003366;
      --brand-navy-deep: #012243;
      --brand-navy-mid: #0b477f;
      --brand-orange: #e56e00;
      --brand-orange-hover: #c85f00;
      --brand-orange-soft: #fff4ea;
      --page: #f6f8fb;
      --surface: #ffffff;
      --surface-muted: #f0f4f8;
      --ink: #1d2939;
      --ink-secondary: #5c6878;
      --line: #dce3eb;
      --success: #157f5b;
      --success-soft: #e8f7f1;
      --warning: #b95c00;
      --warning-soft: #fff4e5;
      --info: #175cd3;
      --info-soft: #eff6ff;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 18px;
      --shadow-card: 0 8px 28px rgba(1, 34, 67, 0.08);
      --content: min(1280px, calc(100% - 64px));
      --ease: 190ms ease-out;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-width: 320px;
      color: var(--ink);
      background: var(--page);
      font-family: Inter, "Noto Sans TC", "PingFang TC", system-ui, sans-serif;
      line-height: 1.6;
      padding-bottom: 112px;
      -webkit-font-smoothing: antialiased;
    }
    button, a, summary { font: inherit; }
    button { color: inherit; }
    a { color: inherit; }
    img { max-width: 100%; }
    :focus-visible {
      outline: 3px solid rgba(229, 110, 0, 0.42);
      outline-offset: 3px;
    }
    .skip-link {
      position: fixed;
      z-index: 200;
      left: 16px;
      top: 12px;
      transform: translateY(-180%);
      padding: 10px 14px;
      border-radius: 8px;
      color: white;
      background: var(--brand-navy-deep);
      transition: transform var(--ease);
    }
    .skip-link:focus { transform: translateY(0); }
    .container { width: var(--content); margin-inline: auto; }
    .prototype-strip {
      position: relative;
      z-index: 40;
      padding: 7px 16px;
      color: #fff;
      background: #101828;
      font-size: 0.73rem;
      font-weight: 800;
      letter-spacing: 0.13em;
      text-align: center;
    }
    .prototype-strip span { color: #ffb06a; }
    .eyebrow {
      margin: 0 0 10px;
      color: var(--brand-orange);
      font-size: 0.76rem;
      font-weight: 850;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .eyebrow.on-dark { color: #ffad63; }
    .muted { color: var(--ink-secondary); }
    .section { padding-block: 72px; }
    .section + .section { border-top: 1px solid var(--line); }
    .section-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 28px;
      margin-bottom: 28px;
    }
    .section-heading h2 {
      max-width: 740px;
      margin: 0;
      color: var(--brand-navy-deep);
      font-family: Georgia, "Noto Serif TC", serif;
      font-size: clamp(1.8rem, 3vw, 2.75rem);
      line-height: 1.14;
      letter-spacing: -0.025em;
    }
    .section-heading p { max-width: 520px; margin: 6px 0 0; color: var(--ink-secondary); }
    .text-link {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      flex: 0 0 auto;
      color: var(--brand-navy);
      font-weight: 780;
      text-decoration-thickness: 1px;
      text-underline-offset: 4px;
    }
    .button {
      display: inline-flex;
      min-height: 44px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 17px;
      border: 1px solid transparent;
      border-radius: 999px;
      font-weight: 800;
      line-height: 1.2;
      text-decoration: none;
      cursor: pointer;
      transition: transform var(--ease), background var(--ease), color var(--ease), border var(--ease);
    }
    .button:hover { transform: translateY(-2px); }
    .button.primary { color: #fff; background: var(--brand-navy); }
    .button.primary:hover { background: var(--brand-navy-deep); }
    .button.accent { color: #fff; background: var(--brand-orange); }
    .button.accent:hover { background: var(--brand-orange-hover); }
    .button.outline { color: var(--brand-navy); border-color: #b9c8d8; background: #fff; }
    .button.ghost-light { color: #fff; border-color: rgba(255,255,255,.35); background: rgba(255,255,255,.08); }
    .button.small { min-height: 38px; padding: 8px 13px; font-size: .88rem; }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      width: fit-content;
      padding: 4px 9px;
      border-radius: 999px;
      color: var(--brand-navy);
      background: var(--info-soft);
      font-size: .72rem;
      font-weight: 850;
      letter-spacing: .035em;
    }
    .badge.orange { color: var(--warning); background: var(--warning-soft); }
    .badge.green { color: var(--success); background: var(--success-soft); }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 0 3px currentColor inset;
    }

    /* Shared navigation */
    .site-header { position: relative; z-index: 30; background: #fff; }
    .site-header.navy { color: #fff; background: var(--brand-navy); }
    .site-header.deep { color: #fff; background: var(--brand-navy-deep); }
    .site-header-row {
      position: relative;
      display: flex;
      min-height: 82px;
      align-items: center;
      gap: 28px;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 13px;
      margin-right: auto;
      color: inherit;
      text-decoration: none;
    }
    .brand-mark {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      border: 1px solid currentColor;
      border-radius: 50%;
      font-family: Georgia, serif;
      font-size: .82rem;
      font-weight: 900;
      letter-spacing: -.03em;
    }
    .brand-copy { display: grid; line-height: 1.18; }
    .brand-copy strong { font-size: 1rem; letter-spacing: .025em; }
    .brand-copy small { margin-top: 3px; opacity: .68; font-size: .68rem; letter-spacing: .06em; }
    .site-nav { display: flex; align-items: center; gap: 4px; }
    .site-nav a {
      padding: 9px 10px;
      border-radius: 8px;
      color: inherit;
      font-size: .88rem;
      font-weight: 730;
      text-decoration: none;
      white-space: nowrap;
      transition: background var(--ease);
    }
    .site-header:not(.nav-light) .site-nav a:hover { background: rgba(0,51,102,.08); }
    .site-header.nav-light .site-nav a:hover { background: rgba(255,255,255,.1); }
    .header-actions { display: flex; align-items: center; gap: 9px; }
    .menu-button {
      display: none;
      width: 44px;
      height: 44px;
      align-items: center;
      justify-content: center;
      border: 1px solid currentColor;
      border-radius: 50%;
      background: transparent;
      cursor: pointer;
    }
    .menu-lines { position: relative; width: 17px; height: 12px; }
    .menu-lines::before,
    .menu-lines::after,
    .menu-lines span {
      position: absolute;
      left: 0;
      width: 100%;
      height: 2px;
      border-radius: 9px;
      background: currentColor;
      content: "";
      transition: transform var(--ease), top var(--ease), opacity var(--ease);
    }
    .menu-lines::before { top: 0; }
    .menu-lines span { top: 5px; }
    .menu-lines::after { top: 10px; }
    .menu-button[aria-expanded="true"] .menu-lines::before { top: 5px; transform: rotate(45deg); }
    .menu-button[aria-expanded="true"] .menu-lines span { opacity: 0; }
    .menu-button[aria-expanded="true"] .menu-lines::after { top: 5px; transform: rotate(-45deg); }

    /* Filters and generated content */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin: 20px 0 24px;
    }
    .filter-label { margin-right: 4px; color: var(--ink-secondary); font-size: .8rem; font-weight: 750; }
    .filter-button {
      min-height: 36px;
      padding: 7px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--brand-navy);
      background: #fff;
      font-size: .82rem;
      font-weight: 760;
      cursor: pointer;
      transition: background var(--ease), color var(--ease), border var(--ease);
    }
    .filter-button:hover { border-color: #9fb4ca; }
    .filter-button.is-active {
      color: #fff;
      border-color: var(--brand-navy);
      background: var(--brand-navy);
    }
    .filter-bar.on-dark .filter-label { color: #bfcee0; }
    .filter-bar.on-dark .filter-button { color: #fff; border-color: rgba(255,255,255,.28); background: rgba(255,255,255,.06); }
    .filter-bar.on-dark .filter-button.is-active { color: var(--brand-navy-deep); border-color: #fff; background: #fff; }
    .filter-readout {
      margin: -12px 0 22px;
      color: var(--ink-secondary);
      font-size: .78rem;
    }
    .filter-readout.on-dark { color: #bfcee0; }
    .empty-state {
      padding: 28px;
      border: 1px dashed #b6c4d3;
      border-radius: var(--radius-md);
      color: var(--ink-secondary);
      text-align: center;
    }
    .meta { color: var(--ink-secondary); font-size: .78rem; font-weight: 660; letter-spacing: .02em; }

    /* Variant A — editorial */
    .variant-a { background: #fbfaf7; }
    .a-hero {
      display: grid;
      grid-template-columns: minmax(0, 1.45fr) minmax(330px, .55fr);
      gap: 46px;
      align-items: stretch;
      padding-block: 64px 72px;
    }
    .a-hero-copy {
      position: relative;
      min-height: 500px;
      padding: clamp(34px, 5vw, 74px);
      overflow: hidden;
      border-radius: 2px 62px 2px 2px;
      color: #fff;
      background: var(--brand-navy-deep);
    }
    .a-hero-copy::after {
      position: absolute;
      right: -70px;
      bottom: -90px;
      width: 330px;
      height: 330px;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 50%;
      box-shadow: 0 0 0 48px rgba(255,255,255,.035), 0 0 0 96px rgba(255,255,255,.025);
      content: "";
    }
    .a-hero-copy > * { position: relative; z-index: 1; }
    .a-hero h1 {
      max-width: 790px;
      margin: 16px 0 22px;
      font-family: Georgia, "Noto Serif TC", serif;
      font-size: clamp(2.5rem, 5.2vw, 5.15rem);
      font-weight: 650;
      line-height: 1.02;
      letter-spacing: -.045em;
    }
    .a-hero-copy > p:not(.eyebrow) { max-width: 650px; color: #dce8f3; font-size: 1.05rem; }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 11px; margin-top: 30px; }
    .issue-line {
      display: flex;
      gap: 24px;
      margin-top: 54px;
      padding-top: 18px;
      border-top: 1px solid rgba(255,255,255,.2);
      color: #b9cce0;
      font-size: .76rem;
      font-weight: 760;
      letter-spacing: .07em;
    }
    .a-deadline-card {
      display: flex;
      flex-direction: column;
      padding: 34px;
      border: 1px solid #eadbce;
      border-radius: 2px;
      background: #fff;
      box-shadow: var(--shadow-card);
    }
    .a-deadline-card h2 {
      margin: 10px 0 4px;
      color: var(--brand-navy-deep);
      font-family: Georgia, "Noto Serif TC", serif;
      font-size: 2.1rem;
      line-height: 1.1;
    }
    .date-display { display: flex; align-items: baseline; gap: 11px; margin: 28px 0 8px; color: var(--brand-orange); }
    .date-display strong { font-family: Georgia, serif; font-size: 4.8rem; line-height: .9; }
    .date-display span { font-weight: 850; }
    .deadline-list { display: grid; gap: 0; margin: 22px 0 30px; }
    .deadline-mini {
      display: grid;
      grid-template-columns: 70px 1fr;
      gap: 16px;
      padding: 15px 0;
      border-top: 1px solid var(--line);
    }
    .deadline-mini time { color: var(--brand-orange); font-weight: 850; }
    .deadline-mini strong { display: block; color: var(--brand-navy); }
    .deadline-mini small { color: var(--ink-secondary); }
    .a-news-layout { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(300px, .8fr); gap: 42px; }
    .lead-story { border-bottom: 4px solid var(--brand-orange); background: #fff; }
    .lead-story-art {
      aspect-ratio: 16 / 9;
      display: flex;
      align-items: end;
      padding: 28px;
      color: #fff;
      background:
        linear-gradient(145deg, rgba(1,34,67,.08), rgba(1,34,67,.82)),
        repeating-linear-gradient(90deg, #416786 0 1px, #315a7c 1px 80px);
    }
    .lead-story-art span { max-width: 420px; font-family: Georgia, "Noto Serif TC", serif; font-size: clamp(1.45rem, 3vw, 2.45rem); line-height: 1.15; }
    .lead-story-copy { padding: 28px; }
    .lead-story-copy h3 { margin: 10px 0; color: var(--brand-navy-deep); font-size: 1.38rem; line-height: 1.35; }
    .story-list { display: grid; align-content: start; }
    .story-row { padding: 22px 0; border-top: 1px solid var(--line); }
    .story-row:first-child { padding-top: 0; border-top: 0; }
    .story-row h3 { margin: 7px 0; color: var(--brand-navy); font-size: 1.08rem; line-height: 1.35; }
    .story-row p { margin: 0; color: var(--ink-secondary); font-size: .9rem; }
    .a-projects { background: #edf2f7; }
    .project-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 22px; }
    .project-card {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: #fff;
      box-shadow: 0 3px 14px rgba(1,34,67,.045);
      transition: transform var(--ease), box-shadow var(--ease);
    }
    .project-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-card); }
    .project-art {
      position: relative;
      display: flex;
      aspect-ratio: 16/9;
      align-items: end;
      overflow: hidden;
      padding: 18px;
      color: #fff;
      background-color: var(--brand-navy);
    }
    .project-art::before {
      position: absolute;
      width: 170px;
      height: 170px;
      right: -42px;
      top: -55px;
      border: 34px solid rgba(255,255,255,.15);
      border-radius: 50%;
      content: "";
    }
    .project-art::after {
      position: absolute;
      left: -10%;
      bottom: 22%;
      width: 120%;
      height: 1px;
      background: rgba(255,255,255,.28);
      transform: rotate(-8deg);
      content: "";
    }
    .project-art span { position: relative; z-index: 1; font-size: .74rem; font-weight: 850; letter-spacing: .08em; }
    .art-teal { background: #146b71; }
    .art-orange { background: #a94e13; }
    .art-blue { background: #194d86; }
    .art-violet { background: #5b4a7e; }
    .art-green { background: #286348; }
    .art-slate { background: #35475e; }
    .project-copy { padding: 20px; }
    .project-copy h3 { margin: 9px 0 8px; color: var(--brand-navy-deep); font-size: 1.08rem; line-height: 1.35; }
    .project-copy p { margin: 0 0 14px; color: var(--ink-secondary); font-size: .88rem; }
    .industry-band {
      display: grid;
      grid-template-columns: minmax(250px,.62fr) minmax(0,1.38fr);
      gap: 54px;
      align-items: start;
      padding: 52px;
      border-radius: 2px 44px 2px 2px;
      color: #fff;
      background: var(--brand-navy);
    }
    .industry-band h2 { margin: 8px 0 16px; font-family: Georgia, "Noto Serif TC", serif; font-size: clamp(2rem,3vw,3.2rem); line-height: 1.08; }
    .industry-band p { color: #d5e1ed; }
    .industry-list { display: grid; gap: 12px; }
    .industry-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 20px;
      align-items: center;
      padding: 18px 20px;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.06);
    }
    .industry-row strong { display: block; }
    .industry-row small { color: #bdd0e2; }
    .a-bottom-grid { display: grid; grid-template-columns: 1.18fr .82fr; gap: 34px; }
    .honor-editorial { display: grid; gap: 14px; }
    .honor-row { display: grid; grid-template-columns: 58px 1fr; gap: 17px; padding: 18px 0; border-top: 1px solid var(--line); }
    .honor-rank { color: var(--brand-orange); font-family: Georgia, serif; font-size: 1.9rem; line-height: 1; }
    .honor-row strong { display: block; color: var(--brand-navy); }
    .rules-card { padding: 30px; border: 1px solid var(--line); border-radius: var(--radius-md); background: #fff; box-shadow: var(--shadow-card); }
    .rules-card h3 { margin: 8px 0 12px; color: var(--brand-navy-deep); font-size: 1.4rem; }
    .rules-card ul { padding-left: 20px; color: var(--ink-secondary); }
    .rules-card details { margin: 18px 0; padding-block: 14px; border-block: 1px solid var(--line); }
    .rules-card summary { color: var(--brand-navy); font-weight: 800; cursor: pointer; }

    /* Variant B — deadlines and news */
    .variant-b { background: #f4f7fa; }
    .b-context-bar { color: #fff; background: var(--brand-orange); }
    .b-context-inner { display: flex; min-height: 40px; align-items: center; justify-content: space-between; gap: 20px; font-size: .78rem; font-weight: 800; }
    .b-context-inner a { text-underline-offset: 3px; }
    .b-intro { display: flex; align-items: end; justify-content: space-between; gap: 40px; padding-block: 44px 28px; }
    .b-intro h1 { margin: 5px 0 0; color: var(--brand-navy-deep); font-size: clamp(2.15rem,4vw,4.2rem); line-height: 1.03; letter-spacing: -.045em; }
    .b-intro-note { max-width: 380px; padding-left: 18px; border-left: 3px solid var(--brand-orange); color: var(--ink-secondary); }
    .b-deadline-board {
      display: grid;
      grid-template-columns: 1.18fr 1fr 1fr;
      overflow: hidden;
      border: 1px solid #cbd7e3;
      border-radius: var(--radius-md);
      background: #fff;
      box-shadow: var(--shadow-card);
    }
    .deadline-block { position: relative; min-height: 188px; padding: 27px; border-left: 1px solid var(--line); }
    .deadline-block:first-child { border-left: 0; background: var(--brand-orange-soft); }
    .deadline-block-top { display: flex; align-items: center; justify-content: space-between; gap: 15px; }
    .deadline-block .countdown { color: var(--warning); font-size: .78rem; font-weight: 900; }
    .deadline-block time { display: block; margin: 20px 0 3px; color: var(--brand-navy); font-size: 1.65rem; font-weight: 900; }
    .deadline-block h2 { margin: 0; color: var(--brand-navy-deep); font-size: 1.05rem; line-height: 1.35; }
    .b-workspace { display: grid; grid-template-columns: minmax(0,1.45fr) minmax(310px,.55fr); gap: 26px; padding-block: 36px 70px; }
    .panel { border: 1px solid var(--line); border-radius: var(--radius-md); background: #fff; box-shadow: 0 3px 16px rgba(1,34,67,.045); }
    .panel-header { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 24px 26px 12px; }
    .panel-header h2 { margin: 0; color: var(--brand-navy-deep); font-size: 1.35rem; }
    .panel-body { padding: 0 26px 26px; }
    .news-feed { display: grid; }
    .feed-row { display: grid; grid-template-columns: 94px 1fr auto; gap: 20px; align-items: start; padding: 22px 0; border-top: 1px solid var(--line); }
    .feed-date { color: var(--ink-secondary); font-size: .78rem; font-weight: 760; }
    .feed-copy h3 { margin: 5px 0 6px; color: var(--brand-navy); font-size: 1.02rem; line-height: 1.4; }
    .feed-copy p { margin: 0; color: var(--ink-secondary); font-size: .85rem; }
    .feed-action { color: var(--brand-orange); font-weight: 900; text-decoration: none; }
    .b-side-stack { display: grid; gap: 18px; align-content: start; }
    .next-step { padding: 26px; color: #fff; background: var(--brand-navy-deep); }
    .next-step h2 { margin: 8px 0 10px; font-size: 1.45rem; line-height: 1.25; }
    .next-step p { color: #c4d5e5; font-size: .9rem; }
    .quick-links { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .quick-link { padding: 15px; border: 1px solid var(--line); border-radius: var(--radius-sm); color: var(--brand-navy); background: #fff; font-size: .84rem; font-weight: 800; text-decoration: none; }
    .quick-link span { display: block; margin-top: 4px; color: var(--ink-secondary); font-size: .72rem; font-weight: 600; }
    .b-industry { padding-block: 64px; color: #fff; background: var(--brand-navy); }
    .b-industry .section-heading h2 { color: #fff; }
    .b-industry .section-heading p { color: #bed0e1; }
    .industry-columns { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 1px; background: rgba(255,255,255,.25); }
    .industry-column { min-height: 230px; padding: 28px; background: var(--brand-navy); }
    .industry-column:hover { background: #073e72; }
    .industry-column h3 { margin: 25px 0 8px; font-size: 1.15rem; }
    .industry-column p { margin: 0; color: #bed0e1; font-size: .87rem; }
    .b-showcase-row { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 18px; }
    .b-project-item { display: grid; grid-template-columns: 124px 1fr; overflow: hidden; border: 1px solid var(--line); background: #fff; }
    .b-project-item .project-art { min-height: 150px; aspect-ratio: auto; }
    .b-project-copy { padding: 18px; }

            <section class="c-signal-strip" id="deadlines"><div class="container c-signal-inner"><div class="signal-label"><span>NEXT DATES</span><strong>近期截止</strong></div>${deadlines.map(item => `<article class="signal-item"><time datetime="${item.iso}">${item.date} · ${item.countdown}</time><strong>${item.title}</strong></article>`).join("")}</div></section>

            <section class="section" id="news"><div class="container c-newsroom"><div class="c-newsroom-intro"><p class="eyebrow">Newsroom</p><h2>消息與競賽</h2><p class="muted">從作品往回看，哪些活動、規則與機會正在形塑下一屆專題。</p>${announcementFilters()}<a class="text-link" href="#news">完整公告列表 →</a></div><div class="c-news-list">${news.map(item => `<article class="c-news-row"><div><span class="badge">${item.category}</span><p class="meta">${item.date}</p></div><div><h3>${item.title}</h3><p>${item.summary}</p></div></article>`).join("")}</div></div></section>

            <section class="section c-industry" id="industry"><div class="container"><div class="section-heading"><div><p class="eyebrow">Open studio briefs</p><h2>下一件作品，可能從一個真實需求開始。</h2><p>公開合作題目以展間編號呈現，讓作品探索與合作入口保持同一條敘事線。</p></div><a class="text-link" href="#industry">查看所有產學題目 →</a></div><div class="studio-grid">${industries.map(item => `<article class="studio-card"><span class="studio-number">${item.number}</span><span class="badge green">${item.status}</span><h3>${item.title}</h3><p>${item.summary}</p><small class="muted">${item.note}</small></article>`).join("")}</div></div></section>

            <section class="section"><div class="container c-honors-rules">
              <section class="c-honors" id="honors"><p class="eyebrow on-dark">Recognition</p><h2>榮譽與競賽相簿</h2><div class="c-honor-grid">${honors.map(item => `<article class="c-honor"><span>${item.mark}</span><strong>${item.title}</strong><small>${item.meta}</small></article>`).join("")}</div><a class="button ghost-light" href="#honors">進入榮譽檔案</a></section>
              <aside class="c-rules" id="rules"><p class="eyebrow">Current rules</p><h2>專題規則<br>2026.1</h2><p>查看生效日期、公開摘要與歷史版本。完整的個人待辦仍在登入後顯示。</p><a class="button primary" href="#rules">查看規則</a><button class="button outline" type="button" data-login>登入／註冊</button></aside>
            </div></section>
            ${footerMarkup()}
          </div>
        `;
      }

      function updateStatePanel(message = state.feedback) {
        state.feedback = message;
        const menuState = state.menuOpen ? "選單已展開" : "選單已收合";
        stateText.textContent = `${message}｜公告：${state.announcementFilter}｜作品：${state.projectYear === "全部" ? "全部屆別" : state.projectYear + " 屆"}｜${menuState}`;
        statePanel.classList.remove("is-updated");
        requestAnimationFrame(() => statePanel.classList.add("is-updated"));
        window.setTimeout(() => statePanel.classList.remove("is-updated"), 420);
      }

      function render(options = {}) {
        const scrollPosition = options.preserveScroll ? window.scrollY : 0;
        document.body.dataset.variant = state.variant;
        app.innerHTML = state.variant === "A" ? variantA() : state.variant === "B" ? variantB() : variantC();
        document.getElementById("currentVariant").textContent = `${state.variant} — ${variants[state.variant].name}`;
        document.querySelectorAll("[data-switch-variant]").forEach(button => {
          const active = button.dataset.switchVariant === state.variant;
          button.classList.toggle("is-active", active);
          button.setAttribute("aria-pressed", String(active));
        });
        bindPageInteractions();
        updateStatePanel();
        if (options.preserveScroll) requestAnimationFrame(() => window.scrollTo(0, scrollPosition));
      }

      function replaceVariantInUrl(key) {
        const url = new URL(window.location.href);
        url.searchParams.set("variant", key);
        try {
          window.history.replaceState({ variant: key }, "", url);
        } catch (error) {
          // Some file:// implementations restrict History API updates; the UI still switches in memory.
          console.info("Prototype URL could not be updated in this browser.", error);
        }
      }

      function switchVariant(key) {
        if (!variants[key]) return;
        state.variant = key;
        state.menuOpen = false;
        replaceVariantInUrl(key);
        render();
        window.scrollTo({ top: 0, behavior: window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
        updateStatePanel(`已切換至 ${key} 版：${variants[key].name}`);
      }

      function cycleVariant(direction) {
        const current = variantKeys.indexOf(state.variant);
        const next = (current + direction + variantKeys.length) % variantKeys.length;
        switchVariant(variantKeys[next]);
      }

      function bindPageInteractions() {
        document.querySelectorAll("[data-menu-toggle]").forEach(button => {
          button.addEventListener("click", () => {
            state.menuOpen = !state.menuOpen;
            const nav = document.getElementById("siteNav");
            nav.classList.toggle("is-open", state.menuOpen);
            button.setAttribute("aria-expanded", String(state.menuOpen));
            button.setAttribute("aria-label", `${state.menuOpen ? "關閉" : "開啟"}網站選單`);
            updateStatePanel(`手機選單已${state.menuOpen ? "展開" : "收合"}`);
          });
        });

        document.querySelectorAll(".site-nav a").forEach(link => {
          link.addEventListener("click", () => {
            state.menuOpen = false;
            updateStatePanel(`已前往「${link.textContent.trim()}」區塊`);
          });
        });

        document.querySelectorAll("[data-announcement-filter]").forEach(button => {
          button.addEventListener("click", () => {
            state.announcementFilter = button.dataset.announcementFilter;
            state.menuOpen = false;
            render({ preserveScroll: true });
            updateStatePanel(`公告分類已切換為「${state.announcementFilter}」`);
          });
        });

        document.querySelectorAll("[data-project-year]").forEach(button => {
          button.addEventListener("click", () => {
            state.projectYear = button.dataset.projectYear;
            state.menuOpen = false;
            render({ preserveScroll: true });
            updateStatePanel(`作品篩選已切換為「${state.projectYear === "全部" ? "全部屆別" : state.projectYear + " 屆"}」`);
          });
        });

        document.querySelectorAll("[data-login]").forEach(button => {
          button.addEventListener("click", () => {
            if (typeof loginDialog.showModal === "function") loginDialog.showModal();
            else loginDialog.setAttribute("open", "");
            updateStatePanel("已開啟唯讀登入入口預覽");
          });
        });
      }

      document.getElementById("previousVariant").addEventListener("click", () => cycleVariant(-1));
      document.getElementById("nextVariant").addEventListener("click", () => cycleVariant(1));
      document.querySelectorAll("[data-switch-variant]").forEach(button => button.addEventListener("click", () => switchVariant(button.dataset.switchVariant)));
      document.querySelector("[data-close-dialog]").addEventListener("click", () => {
        loginDialog.close();
        updateStatePanel("登入入口預覽已關閉，未送出任何資料");
      });
      document.querySelectorAll("[data-login-option]").forEach(button => button.addEventListener("click", () => {
        updateStatePanel(`已預覽「${button.dataset.loginOption}」，原型不會繼續送出`);
      }));
      loginDialog.addEventListener("click", event => {
        if (event.target === loginDialog) {
          loginDialog.close();
          updateStatePanel("登入入口預覽已關閉，未送出任何資料");
        }
      });

      document.addEventListener("keydown", event => {
        const target = event.target;
        const tag = target && target.tagName;
        if (loginDialog.open && event.key !== "Escape") return;
        if (["INPUT", "TEXTAREA", "SELECT"].includes(tag) || (target && target.closest && target.closest("[contenteditable='true']"))) return;
        if (event.key === "ArrowLeft") {
          event.preventDefault();
          cycleVariant(-1);
        }
        if (event.key === "ArrowRight") {
          event.preventDefault();
          cycleVariant(1);
        }
        if (event.key === "Escape" && loginDialog.open) {
          loginDialog.close();
          updateStatePanel("登入入口預覽已關閉，未送出任何資料");
        }
      });

      window.addEventListener("popstate", () => {
        const key = (new URLSearchParams(window.location.search).get("variant") || "A").toUpperCase();
        state.variant = variants[key] ? key : "A";
        state.menuOpen = false;
        render();
      });

      render();
    })();
  </script>
</body>
</html>
