        }

        function render() {
          document.documentElement.dataset.theme = state.theme;
          document.documentElement.dataset.variant = state.variant;
          const renderer = { A: renderVariantA, B: renderVariantB, C: renderVariantC }[state.variant];
          document.getElementById("app").innerHTML = renderer();
          document.querySelectorAll(".variant-btn").forEach((button) => {
            const active = button.dataset.variant === state.variant;
            button.classList.toggle("active", active);
            button.setAttribute("aria-current", active ? "true" : "false");
          });
          document.getElementById("switch-description").textContent = `${state.variant} · ${VARIANT_NAMES[state.variant]}`;
          document.title = `學生 Dashboard 原型 ${state.variant}｜輔大資管專題`;
        }

        function showToast(message) {
          const toast = document.getElementById("toast");
          window.clearTimeout(showToast.timer);
          toast.textContent = message;
          toast.classList.add("visible");
          showToast.timer = window.setTimeout(() => toast.classList.remove("visible"), 2200);
        }

        function setVariant(nextVariant) {
          if (!VARIANTS.includes(nextVariant)) return;
          state.variant = nextVariant;
          state.menuOpen = false;
          const url = new URL(window.location.href);
          url.searchParams.set("variant", nextVariant);
          window.history.replaceState({}, "", url);
          render();
          showToast(`已切換原型 ${nextVariant}：${VARIANT_NAMES[nextVariant]}`);
          window.scrollTo({ top: 0, behavior: "smooth" });
        }

        function cycleVariant(direction) {
          const index = VARIANTS.indexOf(state.variant);
          const nextIndex = (index + direction + VARIANTS.length) % VARIANTS.length;
          setVariant(VARIANTS[nextIndex]);
        }

        function selectTask(taskId) {
          if (!data.tasks.some((task) => task.id === taskId)) return;
          state.selectedTask = taskId;
          state.lastAction = "選取工作";
          render();
        }

        function updateStatus(taskId, status, actionLabel) {
          state.taskStatus[taskId] = status;
          state.selectedTask = taskId;
          state.lastAction = actionLabel;
        }

        document.addEventListener("click", (event) => {
          const variantButton = event.target.closest(".variant-btn[data-variant]");
          if (variantButton) {
            setVariant(variantButton.dataset.variant);
            return;
          }

          const filterButton = event.target.closest("[data-filter]");
          if (filterButton) {
            state.filter = filterButton.dataset.filter;
            const firstVisible = filteredTasks()[0];
            if (firstVisible) state.selectedTask = firstVisible.id;
            state.lastAction = `篩選：${filterLabels[state.filter]}`;
            render();
            showToast(`目前顯示：${filterLabels[state.filter]}`);
            return;
          }

          const taskButton = event.target.closest("[data-task]");
          if (taskButton) {
            selectTask(taskButton.dataset.task);
            return;
          }

          const versionButton = event.target.closest("[data-version]");
          if (versionButton) {
            state.activeVersion = versionButton.dataset.version;
            state.lastAction = `查看 ${state.activeVersion.toUpperCase()}`;
            render();
            showToast(`已切換到共用草稿 ${state.activeVersion.toUpperCase()}`);
            return;
          }

          const actionTarget = event.target.closest("[data-action]");
          if (!actionTarget) return;
          const action = actionTarget.dataset.action;

          if (action === "previous-variant") return cycleVariant(-1);
          if (action === "next-variant") return cycleVariant(1);
          if (action === "toggle-theme") {
            state.theme = state.theme === "light" ? "dark" : "light";
            state.lastAction = `切換${state.theme === "dark" ? "深色" : "淺色"}主題`;
            render();
            showToast(`已切換為${state.theme === "dark" ? "深色" : "淺色"}主題`);
            return;
          }
          if (action === "toggle-versions") {
            state.versionsExpanded = !state.versionsExpanded;
            state.lastAction = state.versionsExpanded ? "展開版本" : "收合版本";
            render();
            return;
          }
          if (action === "toggle-menu") {
            state.menuOpen = !state.menuOpen;
            render();
            return;
          }
          if (action === "close-menu") {
            state.menuOpen = false;
            render();
            return;
          }
          if (action === "consent") {
            state.consented = true;
            updateStatus("task-consent", "submitted", "完成本人同意");
            state.receipt = {
              title: "本人同意已完成（原型模擬）",
              message: "模擬回執 FJU-CONSENT-P08；此狀態只存在目前頁面。",
            };
            render();
            showToast("已模擬完成本人同意");
            return;
          }
          if (action === "submit-proposal") {
            updateStatus("task-proposal", "submitted", "送出研究計畫書");
            state.autosave = "已送出 · 14:24";
            state.receipt = {
              title: "研究計畫書已送出（原型模擬）",
              message: "模擬回執 FJU-P08-DRAFT-V4；送出後狀態已在工作清單更新。",
            };
            render();
            showToast("已模擬送出共用草稿 v4");
            return;
          }
          if (action === "resubmit") {
            updateStatus("task-resubmit", "submitted", "完成補正重送");
            state.receipt = {
              title: "補正文件已重新送出（原型模擬）",
              message: "模擬回執 FJU-P08-RESUBMIT；原本的需重送狀態已更新。",
            };
            render();
            showToast("已模擬完成補正重送");
            return;
          }
          if (action === "save-draft") {
            state.autosave = "儲存中…";
            state.lastAction = "儲存共用草稿";
            render();
            window.setTimeout(() => {
              state.autosave = "已儲存 · 14:23";
              state.lastAction = "草稿儲存完成";
              render();
              showToast("共用草稿已模擬儲存");
            }, 520);
            return;
          }
          if (action === "start-task") {
            const taskId = actionTarget.dataset.taskId;
            updateStatus(taskId, "draft", "開始處理工作");
            render();
            showToast("已將工作切換為草稿狀態");
          }
        });

        document.addEventListener("keydown", (event) => {
          const target = event.target;
          const isTyping = target instanceof HTMLInputElement || target instanceof HTMLTextAreaElement || target instanceof HTMLSelectElement;
          if (isTyping || event.altKey || event.ctrlKey || event.metaKey) return;
          if (event.key === "ArrowLeft") {
            event.preventDefault();
            cycleVariant(-1);
          }
          if (event.key === "ArrowRight") {
            event.preventDefault();
            cycleVariant(1);
          }
        });

        window.addEventListener("popstate", () => {
          const candidate = new URLSearchParams(window.location.search).get("variant")?.toUpperCase();
          if (VARIANTS.includes(candidate)) {
            state.variant = candidate;
            render();
          }
        });

        render();
      })();
    </script>
  </body>
</html>
