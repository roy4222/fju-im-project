<!doctype html>
<html lang="zh-Hant" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="輔仁大學資訊管理學系專題網站學生 Dashboard 拋棄式 UI 原型，僅含虛構資料。"
    />
    <title>學生 Dashboard UI 原型｜輔大資管專題</title>
    <style>
      :root {
        color-scheme: light;
        --brand-navy: #003366;
        --brand-navy-deep: #012243;
        --brand-orange: #e56e00;
        --brand-orange-hover: #c85f00;
        --brand-orange-soft: #fff4ea;
        --page: #f6f8fb;
        --surface: #ffffff;
        --surface-elevated: #ffffff;
        --surface-muted: #f0f4f8;
        --surface-hover: #e9f0f7;
        --ink: #1d2939;
        --ink-secondary: #5c6878;
        --line: #dce3eb;
        --line-strong: #c2cedb;
        --success: #157f5b;
        --success-soft: #e8f7f1;
        --warning: #b95c00;
        --warning-soft: #fff4e5;
        --danger: #b42318;
        --danger-soft: #fff0ee;
        --info: #175cd3;
        --info-soft: #eff6ff;
        --focus: #3d8bfd;
        --radius-sm: 8px;
        --radius-md: 12px;
        --radius-lg: 18px;
        --shadow-card: 0 8px 28px rgba(1, 34, 67, 0.08);
        --shadow-float: 0 16px 46px rgba(1, 34, 67, 0.2);
        --ease: 180ms ease-out;
      }

      html[data-theme="dark"] {
        color-scheme: dark;
        --page: #09131f;
        --surface: #101d2b;
        --surface-elevated: #142437;
        --surface-muted: #18283a;
        --surface-hover: #20364c;
        --ink: #f2f6fa;
        --ink-secondary: #aebccc;
        --line: #293d52;
        --line-strong: #3e5871;
        --brand-navy: #8fc5ff;
        --brand-navy-deep: #071728;
        --brand-orange: #ff9a3d;
        --brand-orange-hover: #ffad61;
        --brand-orange-soft: #392312;
        --success: #72d7b4;
        --success-soft: #13382d;
        --warning: #ffb35c;
        --warning-soft: #3a2814;
        --danger: #ff8a80;
        --danger-soft: #3b1b1d;
        --info: #8cbcff;
        --info-soft: #142b4c;
        --focus: #83b9ff;
        --shadow-card: 0 10px 32px rgba(0, 0, 0, 0.24);
        --shadow-float: 0 18px 54px rgba(0, 0, 0, 0.44);
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        padding-bottom: 106px;
        background: var(--page);
        color: var(--ink);
        font-family: Inter, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui,
          sans-serif;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      button,
      input,
      select {
        font: inherit;
      }

      button,
      a {
        -webkit-tap-highlight-color: transparent;
      }

      button {
        color: inherit;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      button:focus-visible,
      a:focus-visible,
      [tabindex]:focus-visible {
        outline: 3px solid color-mix(in srgb, var(--focus) 52%, transparent);
        outline-offset: 2px;
      }

      h1,
      h2,
      h3,
      p,
      dl,
      dd {
        margin-top: 0;
      }

      h1,
      h2,
      h3 {
        color: var(--ink);
        line-height: 1.25;
        letter-spacing: -0.02em;
      }

      h1 {
        margin-bottom: 8px;
        font-size: clamp(1.6rem, 3vw, 2.35rem);
      }

      h2 {
        margin-bottom: 6px;
        font-size: clamp(1.15rem, 2vw, 1.38rem);
      }

      h3 {
        margin-bottom: 4px;
        font-size: 1rem;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .muted {
        color: var(--ink-secondary);
      }

      .eyebrow {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
        color: var(--brand-navy);
        font-size: 0.74rem;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .eyebrow::before {
        width: 20px;
        height: 3px;
        border-radius: 99px;
        background: var(--brand-orange);
        content: "";
      }

      .card {
        border: 1px solid var(--line);
        border-radius: var(--radius-lg);
        background: var(--surface);
        box-shadow: var(--shadow-card);
      }

      .card-pad {
        padding: 20px;
      }

      .section-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 16px;
      }

      .section-head p {
        margin-bottom: 0;
        color: var(--ink-secondary);
        font-size: 0.9rem;
      }

      .pill,
      .status-badge,
      .count-chip {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        border-radius: 999px;
        font-size: 0.76rem;
        font-weight: 750;
        line-height: 1;
        white-space: nowrap;
      }

      .pill {
        min-height: 27px;
        padding: 6px 10px;
        border: 1px solid var(--line);
        background: var(--surface-muted);
        color: var(--ink-secondary);
      }

      .pill.prototype {
        border-color: color-mix(in srgb, var(--brand-orange) 36%, var(--line));
        background: var(--brand-orange-soft);
        color: var(--warning);
      }

      .status-badge {
        min-height: 28px;
        padding: 6px 10px;
        border: 1px solid transparent;
      }

      .status-badge::before {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: currentColor;
        content: "";
      }

      .status-todo {
        border-color: color-mix(in srgb, var(--info) 28%, transparent);
        background: var(--info-soft);
        color: var(--info);
      }

      .status-draft {
        border-color: color-mix(in srgb, var(--warning) 28%, transparent);
        background: var(--warning-soft);
        color: var(--warning);
      }

      .status-submitted {
        border-color: color-mix(in srgb, var(--success) 28%, transparent);
        background: var(--success-soft);
        color: var(--success);
      }

      .status-resubmit,
      .status-overdue {
        border-color: color-mix(in srgb, var(--danger) 28%, transparent);
        background: var(--danger-soft);
        color: var(--danger);
      }

      .btn {
        display: inline-flex;
        min-height: 42px;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 10px 14px;
        border: 1px solid transparent;
        border-radius: 10px;
        background: transparent;
        cursor: pointer;
        font-size: 0.88rem;
        font-weight: 750;
        transition:
          transform var(--ease),
          background var(--ease),
          border-color var(--ease),
          color var(--ease);
      }

      .btn:hover {
        transform: translateY(-1px);
      }

      .btn-primary {
        background: var(--brand-navy);
        color: var(--surface);
      }

      html[data-theme="dark"] .btn-primary {
        background: #d5eaff;
        color: #05203b;
      }

      .btn-primary:hover {
        background: var(--brand-navy-deep);
        color: white;
      }

      .btn-orange {
        background: var(--brand-orange);
        color: #fff;
      }

      .btn-orange:hover {
        background: var(--brand-orange-hover);
      }

      .btn-secondary {
        border-color: var(--line);
        background: var(--surface);
        color: var(--ink);
      }

      .btn-secondary:hover {
        border-color: var(--line-strong);
        background: var(--surface-muted);
      }

      .btn-ghost {
        color: var(--ink-secondary);
      }

      .btn-ghost:hover {
        background: var(--surface-muted);
        color: var(--ink);
      }

      .btn[disabled] {
        cursor: not-allowed;
        opacity: 0.5;
        transform: none;
      }

      .icon-btn {
        display: inline-grid;
        width: 42px;
        height: 42px;
        flex: 0 0 auto;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 11px;
        background: var(--surface);
        cursor: pointer;
        font-size: 1.05rem;
        transition: background var(--ease), border-color var(--ease);
      }

      .icon-btn:hover {
        border-color: var(--line-strong);
        background: var(--surface-muted);
      }

      .topbar {
        display: flex;
        min-height: 70px;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding: 0 24px;
        border-bottom: 1px solid var(--line);
        background: color-mix(in srgb, var(--surface) 92%, transparent);
        backdrop-filter: blur(14px);
      }

      .brand-lockup {
        display: flex;
        min-width: 0;
        align-items: center;
        gap: 12px;
      }

      .brand-mark {
        display: grid;
        width: 40px;
        height: 40px;
        flex: 0 0 auto;
        place-items: center;
        border-radius: 11px;
        background: var(--brand-navy-deep);
        color: #fff;
        font-size: 0.88rem;
        font-weight: 900;
        letter-spacing: -0.05em;
      }

      .brand-text {
        min-width: 0;
      }

      .brand-text strong,
      .brand-text span {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .brand-text strong {
        color: var(--brand-navy);
        font-size: 0.92rem;
      }

      .brand-text span {
        color: var(--ink-secondary);
        font-size: 0.76rem;
      }

      .top-actions,
      .inline-actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .student-chip {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 6px 9px 6px 6px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--surface);
      }

      .avatar {
        display: grid;
        width: 30px;
        height: 30px;
        place-items: center;
        border-radius: 50%;
        background: var(--brand-orange-soft);
        color: var(--warning);
        font-size: 0.72rem;
        font-weight: 900;
      }

      .student-chip span:last-child {
        color: var(--ink-secondary);
        font-size: 0.78rem;
        font-weight: 700;
      }

      .receipt {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        margin-bottom: 18px;
        padding: 16px 18px;
        border: 1px solid color-mix(in srgb, var(--success) 34%, var(--line));
        border-radius: var(--radius-md);
        background: var(--success-soft);
        color: var(--success);
      }

      .receipt-mark {
        display: grid;
        width: 28px;
        height: 28px;
        flex: 0 0 auto;
        place-items: center;
        border-radius: 50%;
        background: var(--success);
        color: var(--surface);
        font-weight: 900;
      }

      .receipt strong {
        display: block;
        margin-bottom: 2px;
      }

      .receipt p {
        margin: 0;
        color: var(--ink-secondary);
        font-size: 0.84rem;
      }

      .group-summary {
        display: grid;
        gap: 14px;
      }

      .group-meta {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .meta-box {
        padding: 12px;
        border-radius: var(--radius-sm);
        background: var(--surface-muted);
      }

      .meta-box span {
        display: block;
        margin-bottom: 3px;
        color: var(--ink-secondary);
        font-size: 0.72rem;
      }

      .meta-box strong {
        display: block;
        overflow: hidden;
        font-size: 0.86rem;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .member-list {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .member {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 7px 9px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--surface);
        color: var(--ink-secondary);
        font-size: 0.76rem;
        font-weight: 650;
      }

      .member::before {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: var(--success-soft);
        color: var(--success);
        content: "✓";
        font-size: 0.65rem;
        font-weight: 900;
        line-height: 16px;
        text-align: center;
      }

      .progress-track {
        height: 7px;
        overflow: hidden;
        border-radius: 99px;
        background: var(--surface-muted);
      }

      .progress-track > span {
        display: block;
        width: 100%;
        height: 100%;
        border-radius: inherit;
        background: var(--success);
      }

      .announcement-list,
      .version-list,
      .compact-list {
        display: grid;
        gap: 9px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .announcement-item {
        padding: 12px 0;
        border-bottom: 1px solid var(--line);
      }

      .announcement-item:first-child {
        padding-top: 0;
      }

      .announcement-item:last-child {
        padding-bottom: 0;
        border-bottom: 0;
      }

      .announcement-item time {
        display: block;
        margin-bottom: 3px;
        color: var(--ink-secondary);
        font-size: 0.72rem;
      }

      .announcement-item strong {
        display: block;
        margin-bottom: 3px;
        font-size: 0.88rem;
      }

      .announcement-item p {
        margin: 0;
        color: var(--ink-secondary);
        font-size: 0.8rem;
      }

      .version-toggle {
        width: 100%;
        justify-content: space-between;
      }

      .version-summary {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: 12px;
        padding: 12px;
        border-radius: var(--radius-sm);
        background: var(--surface-muted);
      }

      .version-summary strong,
      .version-summary span {
        display: block;
      }

      .version-summary strong {
        font-size: 0.84rem;
      }

      .version-summary span {
        color: var(--ink-secondary);
        font-size: 0.74rem;
      }

      .version-list {
        margin-top: 10px;
      }

      .version-button {
        display: grid;
        width: 100%;
        grid-template-columns: auto 1fr auto;
        align-items: center;
        gap: 10px;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--surface);
        cursor: pointer;
        text-align: left;
      }

      .version-button:hover,
      .version-button.active {
        border-color: color-mix(in srgb, var(--brand-navy) 48%, var(--line));
        background: var(--info-soft);
      }

      .version-code {
        display: grid;
        width: 34px;
        height: 34px;
        place-items: center;
        border-radius: 9px;
        background: var(--surface-muted);
        font-size: 0.74rem;
        font-weight: 850;
      }

      .version-copy strong,
      .version-copy span {
        display: block;
      }

      .version-copy strong {
        font-size: 0.8rem;
      }

      .version-copy span,
      .version-button time {
        color: var(--ink-secondary);
        font-size: 0.7rem;
      }

      .state-panel {
        position: relative;
        overflow: hidden;
        border: 1px dashed color-mix(in srgb, var(--brand-orange) 48%, var(--line));
        border-radius: var(--radius-lg);
        background: color-mix(in srgb, var(--brand-orange-soft) 70%, var(--surface));
      }

      .state-panel::before {
        position: absolute;
        top: 0;
        left: 0;
        width: 4px;
        height: 100%;
        background: var(--brand-orange);
        content: "";
      }

      .state-panel .card-pad {
        padding-left: 22px;
      }

      .state-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
      }

      .state-title strong {
        color: var(--warning);
        font-size: 0.78rem;
        letter-spacing: 0.08em;
      }

      .state-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px 12px;
        margin-bottom: 12px;
      }

      .state-grid div {
        min-width: 0;
      }

      .state-grid dt {
        color: var(--ink-secondary);
        font-size: 0.68rem;
      }

      .state-grid dd {
        margin: 1px 0 0;
        overflow: hidden;
        font-size: 0.78rem;
        font-weight: 750;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .state-note {
        margin: 0;
        color: var(--ink-secondary);
        font-size: 0.73rem;
      }

      .prototype-switcher {
        position: fixed;
        z-index: 1000;
        right: 50%;
        bottom: 14px;
        display: grid;
        width: min(660px, calc(100vw - 28px));
        min-height: 72px;
        grid-template-columns: 44px minmax(0, 1fr) 44px;
        align-items: center;
        gap: 10px;
        padding: 9px;
        border: 1px solid color-mix(in srgb, #fff 20%, var(--line));
        border-radius: 18px;
        background: color-mix(in srgb, var(--brand-navy-deep) 96%, transparent);
        box-shadow: var(--shadow-float);
        color: #fff;
        transform: translateX(50%);
        backdrop-filter: blur(18px);
      }

      .switch-arrow {
        display: grid;
        width: 44px;
        height: 44px;
        place-items: center;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 11px;
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
        cursor: pointer;
        font-size: 1.3rem;
        transition: background var(--ease), transform var(--ease);
      }

      .switch-arrow:hover {
        background: rgba(255, 255, 255, 0.16);
        transform: translateY(-1px);
      }

      .switch-center {
        display: flex;
        min-width: 0;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
      }

      .switch-label {
        min-width: 0;
      }

      .switch-label strong,
      .switch-label span {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .switch-label strong {
        font-size: 0.76rem;
        letter-spacing: 0.07em;
      }

      .switch-label span {
        color: rgba(255, 255, 255, 0.64);
        font-size: 0.68rem;
      }

      .variant-buttons {
        display: flex;
        gap: 6px;
      }

      .variant-btn {
        display: grid;
        width: 37px;
        height: 37px;
        place-items: center;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.07);
        color: rgba(255, 255, 255, 0.72);
        cursor: pointer;
        font-size: 0.78rem;
        font-weight: 850;
      }

      .variant-btn.active {
        border-color: var(--brand-orange);
        background: var(--brand-orange);
        color: #fff;
      }

      .toast {
        position: fixed;
        z-index: 1200;
        top: 18px;
        left: 50%;
        max-width: calc(100vw - 32px);
        padding: 11px 16px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--surface-elevated);
        box-shadow: var(--shadow-float);
        color: var(--ink);
        font-size: 0.84rem;
        font-weight: 700;
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, -12px);
        transition: opacity var(--ease), transform var(--ease);
      }

      .toast.visible {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      /* Variant A — deadline and timeline first */
      .a-shell {
        max-width: 1320px;
        margin: 0 auto;
      }

      .a-topbar {
        position: sticky;
        z-index: 30;
        top: 0;
      }

      .a-content {
        padding: 34px 28px 48px;
      }

      .a-intro {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 22px;
      }

      .a-intro p {
        margin: 0;
        color: var(--ink-secondary);
      }

      .deadline-hero {
        position: relative;
        display: grid;
        grid-template-columns: minmax(0, 1.5fr) minmax(250px, 0.6fr) auto;
        align-items: center;
        gap: 28px;
        margin-bottom: 24px;
        padding: 26px 28px;
        overflow: hidden;
        border: 1px solid color-mix(in srgb, var(--brand-orange) 34%, var(--line));
        border-radius: 22px;
        background:
          linear-gradient(100deg, color-mix(in srgb, var(--brand-orange-soft) 88%, var(--surface)) 0 62%, var(--surface) 62% 100%);
        box-shadow: var(--shadow-card);
      }

      .deadline-hero::after {
        position: absolute;
        top: -70px;
        right: 21%;
        width: 170px;
        height: 170px;
        border: 28px solid color-mix(in srgb, var(--brand-orange) 10%, transparent);
        border-radius: 50%;
        content: "";
        pointer-events: none;
      }

      .deadline-copy,
      .countdown,
      .deadline-hero .btn {
        position: relative;
        z-index: 1;
      }

      .deadline-copy span {
        display: block;
        margin-bottom: 5px;
        color: var(--warning);
        font-size: 0.76rem;
        font-weight: 850;
        letter-spacing: 0.06em;
      }

      .deadline-copy h2 {
        margin-bottom: 7px;
        font-size: clamp(1.18rem, 2.2vw, 1.7rem);
      }

      .deadline-copy p {
        margin: 0;
        color: var(--ink-secondary);
        font-size: 0.88rem;
      }

      .countdown {
        padding-left: 26px;
        border-left: 1px solid var(--line);
      }

      .countdown span,
      .countdown strong {
        display: block;
      }

      .countdown span {
        margin-bottom: 3px;
        color: var(--ink-secondary);
        font-size: 0.72rem;
      }

      .countdown strong {
        color: var(--brand-navy);
        font-size: clamp(1.45rem, 3vw, 2.15rem);
        letter-spacing: -0.04em;
      }

      .a-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.48fr) minmax(330px, 0.72fr);
        align-items: start;
        gap: 22px;
      }

      .timeline-card {
        padding: 22px;
      }

      .timeline {
        position: relative;
        display: grid;
        gap: 0;
      }

      .timeline::before {
        position: absolute;
        top: 12px;
        bottom: 22px;
        left: 52px;
        width: 2px;
        background: var(--line);
        content: "";
      }

      .timeline-day {
        position: relative;
        display: grid;
        grid-template-columns: 74px 1fr;
        gap: 12px;
        padding-bottom: 22px;
      }

      .timeline-day:last-child {
        padding-bottom: 0;
      }

      .date-node {
        position: relative;
        z-index: 1;
        align-self: start;
        text-align: center;
      }

      .date-node span,
      .date-node strong {
        display: block;
      }

      .date-node span {
        color: var(--ink-secondary);
        font-size: 0.68rem;
        font-weight: 750;
      }

      .date-node strong {
        width: 42px;
        height: 42px;
        margin: 3px auto 0;
        border: 3px solid var(--surface);
        border-radius: 50%;
        background: var(--brand-navy-deep);
        box-shadow: 0 0 0 1px var(--line);
        color: #fff;
        font-size: 0.86rem;
        line-height: 36px;
      }

      .timeline-day.urgent .date-node strong {
        background: var(--brand-orange);
      }

      .timeline-day.overdue .date-node strong {
        background: var(--danger);
      }

      .timeline-items {
        display: grid;
        gap: 10px;
      }

      .timeline-task {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 14px;
        padding: 15px 16px;
        border: 1px solid var(--line);
        border-radius: var(--radius-md);
        background: var(--surface);
        transition: transform var(--ease), border-color var(--ease), box-shadow var(--ease);
      }

      .timeline-task:hover {
        border-color: var(--line-strong);
        box-shadow: 0 6px 18px rgba(1, 34, 67, 0.06);
        transform: translateY(-1px);
      }

      .timeline-task h3 {
        margin-bottom: 5px;
      }

      .task-subline {
        display: flex;
        flex-wrap: wrap;
        gap: 7px 12px;
        color: var(--ink-secondary);
        font-size: 0.76rem;
      }

      .a-aside {
        display: grid;
        gap: 16px;
      }

      /* Variant B — status workspace first */
      .b-shell {
        min-height: calc(100vh - 106px);
        background:
          linear-gradient(var(--line) 1px, transparent 1px),
          linear-gradient(90deg, var(--line) 1px, transparent 1px),
          var(--page);
        background-size: 42px 42px;
        background-position: -1px -1px;
      }

      .b-topbar {
        position: sticky;
        z-index: 30;
        top: 0;
      }

      .b-content {
        max-width: 1420px;
        margin: 0 auto;
        padding: 28px;
      }

      .b-command {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 22px;
        margin-bottom: 18px;
        padding: 20px 22px;
        border-left: 5px solid var(--brand-orange);
        border-radius: 0 var(--radius-lg) var(--radius-lg) 0;
        background: var(--surface);
        box-shadow: var(--shadow-card);
      }

      .b-command h1 {
        margin-bottom: 5px;
        font-size: clamp(1.32rem, 2.3vw, 1.82rem);
      }

      .b-command p {
        margin: 0;
        color: var(--ink-secondary);
        font-size: 0.86rem;
      }

      .b-countdown {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .b-countdown strong {
        color: var(--brand-orange);
        font-size: 1.35rem;
        white-space: nowrap;
      }

      .b-workspace {
        display: grid;
        grid-template-columns: 210px minmax(0, 1fr) 330px;
        align-items: start;
        gap: 16px;
      }

      .filter-rail {
        position: sticky;
        top: 88px;
        padding: 14px;
      }

      .filter-rail h2 {
        margin: 6px 8px 12px;
        font-size: 0.92rem;
      }

      .filter-stack {
        display: grid;
        gap: 5px;
      }

      .filter-button {
        display: grid;
        width: 100%;
        min-height: 43px;
        grid-template-columns: 12px 1fr auto;
        align-items: center;
        gap: 9px;
        padding: 9px 10px;
        border: 0;
        border-radius: 9px;
        background: transparent;
        cursor: pointer;
        text-align: left;
      }

      .filter-button:hover,
      .filter-button.active {
        background: var(--surface-muted);
      }

      .filter-button.active {
        color: var(--brand-navy);
        font-weight: 800;
      }

      .filter-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--line-strong);
      }

      .filter-dot.todo {
        background: var(--info);
      }

      .filter-dot.draft {
        background: var(--warning);
      }

      .filter-dot.submitted {
        background: var(--success);
      }

      .filter-dot.resubmit,
      .filter-dot.overdue {
        background: var(--danger);
      }

      .count-chip {
        min-width: 25px;
        height: 24px;
        padding: 0 7px;
        background: var(--surface);
        color: var(--ink-secondary);
      }

      .workspace-main {
        min-width: 0;
      }

      .queue-card {
        overflow: hidden;
      }

      .queue-toolbar {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 18px;
        padding: 20px;
        border-bottom: 1px solid var(--line);
      }

      .queue-toolbar h2 {
        margin-bottom: 3px;
      }

      .queue-toolbar p {
        margin: 0;
        color: var(--ink-secondary);
        font-size: 0.8rem;
      }

      .queue-head,
      .queue-row {
        display: grid;
        grid-template-columns: minmax(220px, 1.4fr) 108px 126px 34px;
        align-items: center;
        gap: 14px;
      }

      .queue-head {
        min-width: 660px;
        padding: 10px 18px;
        border-bottom: 1px solid var(--line);
        background: var(--surface-muted);
        color: var(--ink-secondary);
        font-size: 0.7rem;
        font-weight: 800;
        letter-spacing: 0.04em;
      }

      .queue-scroll {
        overflow-x: auto;
      }

      .queue-row {
        width: 100%;
        min-width: 660px;
        min-height: 73px;
        padding: 12px 18px;
        border: 0;
        border-bottom: 1px solid var(--line);
        background: var(--surface);
        cursor: pointer;
        text-align: left;
        transition: background var(--ease);
      }

      .queue-row:last-child {
        border-bottom: 0;
      }

      .queue-row:hover,
      .queue-row.selected {
        background: var(--surface-muted);
      }

      .queue-row.selected {
        box-shadow: inset 3px 0 var(--brand-orange);
      }

      .queue-title {
        min-width: 0;
      }

      .queue-title strong,
      .queue-title span {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .queue-title strong {
        font-size: 0.86rem;
      }

      .queue-title span,
      .queue-due {
        color: var(--ink-secondary);
        font-size: 0.72rem;
      }

      .queue-open {
        color: var(--brand-navy);
        font-size: 1.05rem;
        text-align: right;
      }

      .empty-state {
        padding: 48px 20px;
        text-align: center;
      }

      .empty-mark {
        display: grid;
        width: 44px;
        height: 44px;
        margin: 0 auto 12px;
        place-items: center;
        border-radius: 50%;
        background: var(--success-soft);
        color: var(--success);
        font-weight: 900;
      }

      .detail-drawer {
        margin-top: 16px;
        padding: 20px;
      }

      .detail-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: end;
        gap: 20px;
      }

      .detail-drawer p {
        color: var(--ink-secondary);
        font-size: 0.84rem;
      }

      .detail-facts {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .b-aside {
        display: grid;
        gap: 16px;
      }

      .context-strip {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin-top: 16px;
      }

      .context-mini {
        padding: 15px 16px;
        border: 1px solid var(--line);
        border-radius: var(--radius-md);
        background: var(--surface);
      }

      .context-mini span,
      .context-mini strong {
        display: block;
      }

      .context-mini span {
        margin-bottom: 4px;
        color: var(--ink-secondary);
        font-size: 0.7rem;
      }

      .context-mini strong {
        overflow: hidden;
        font-size: 0.84rem;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* Variant C — Kiranism-style shell */
      .c-app {
        min-height: calc(100vh - 106px);
        background: var(--page);
      }

      .c-sidebar {
        position: fixed;
        z-index: 70;
        top: 0;
        bottom: 0;
        left: 0;
        display: flex;
        width: 242px;
        flex-direction: column;
        padding: 18px 14px 118px;
        border-right: 1px solid #163959;
        background: var(--brand-navy-deep);
        color: #d6e7f8;
        transition: transform 220ms ease-out;
      }

      .c-sidebar .brand-lockup {
        margin: 0 6px 24px;
      }

      .c-sidebar .brand-mark {
        border: 1px solid rgba(255, 255, 255, 0.16);
        background: rgba(255, 255, 255, 0.1);
      }

      .c-sidebar .brand-text strong {
        color: #fff;
      }

      .c-sidebar .brand-text span {
        color: #89a9c6;
      }

      .c-nav-label {
        margin: 11px 10px 7px;
        color: #7695b2;
        font-size: 0.66rem;
        font-weight: 850;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .c-nav {
        display: grid;
        gap: 4px;
      }

      .c-nav a,
      .c-nav button {
        display: flex;
        width: 100%;
        min-height: 42px;
        align-items: center;
        gap: 11px;
        padding: 9px 11px;
        border: 0;
        border-radius: 10px;
        background: transparent;
        color: #bcd2e6;
        cursor: pointer;
        font-size: 0.83rem;
        font-weight: 650;
        text-align: left;
      }

      .c-nav a:hover,
      .c-nav a.active,
      .c-nav button:hover {
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
      }

      .nav-icon {
        display: grid;
        width: 22px;
        height: 22px;
        place-items: center;
        border-radius: 7px;
        background: rgba(255, 255, 255, 0.08);
        font-size: 0.75rem;
        font-weight: 850;
      }

      .c-sidebar-foot {
        margin-top: auto;
        padding: 13px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.06);
      }

      .c-sidebar-foot strong,
      .c-sidebar-foot span {
        display: block;
      }

      .c-sidebar-foot strong {
        margin-bottom: 3px;
        color: #fff;
        font-size: 0.78rem;
      }

      .c-sidebar-foot span {
        color: #8ba8c2;
        font-size: 0.7rem;
      }

      .c-main {
        min-width: 0;
        margin-left: 242px;
      }

      .c-topbar {
        position: sticky;
        z-index: 40;
        top: 0;
      }

      .c-menu-button {
        display: none;
      }

      .search-shell {
        display: flex;
        width: min(410px, 38vw);
        min-height: 40px;
        align-items: center;
        gap: 9px;
        padding: 0 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--surface-muted);
        color: var(--ink-secondary);
      }

      .search-shell input {
        width: 100%;
        min-width: 0;
        border: 0;
        outline: 0;
        background: transparent;
        color: var(--ink);
        font-size: 0.82rem;
      }

      .c-content {
        max-width: 1320px;
        margin: 0 auto;
        padding: 28px;
      }

      .c-intro {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 20px;
      }

      .c-intro p {
        margin: 0;
        color: var(--ink-secondary);
      }

      .quick-grid {
        display: grid;
        grid-template-columns: 1.35fr repeat(3, 1fr);
        gap: 14px;
        margin-bottom: 18px;
      }

      .quick-card {
        min-width: 0;
        padding: 17px 18px;
        border: 1px solid var(--line);
        border-radius: var(--radius-md);
        background: var(--surface);
        box-shadow: 0 4px 16px rgba(1, 34, 67, 0.05);
      }

      .quick-card.primary {
        border-color: color-mix(in srgb, var(--brand-orange) 34%, var(--line));
        background: var(--brand-orange-soft);
      }

      .quick-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 14px;
      }

      .quick-icon {
        display: grid;
        width: 34px;
        height: 34px;
        place-items: center;
        border-radius: 10px;
        background: var(--surface-muted);
        color: var(--brand-navy);
        font-size: 0.78rem;
        font-weight: 900;
      }

      .quick-card.primary .quick-icon {
        background: var(--brand-orange);
        color: #fff;
      }

      .quick-card small,
      .quick-card strong,
      .quick-card span {
        display: block;
        min-width: 0;
      }

      .quick-card small {
        margin-bottom: 4px;
        color: var(--ink-secondary);
        font-size: 0.7rem;
      }

      .quick-card strong {
        overflow: hidden;
        margin-bottom: 4px;
        font-size: 1.02rem;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .quick-card span {
        color: var(--ink-secondary);
        font-size: 0.74rem;
      }

      .c-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.45fr) minmax(315px, 0.62fr);
        align-items: start;
        gap: 18px;
      }

      .work-card {
        overflow: hidden;
      }

      .work-card .section-head {
        margin: 0;
        padding: 20px;
        border-bottom: 1px solid var(--line);
      }

      .compact-tabs {
        display: flex;
        gap: 5px;
        padding: 10px 16px;
        overflow-x: auto;
        border-bottom: 1px solid var(--line);
        background: var(--surface-muted);
      }

      .compact-tab {
        min-height: 34px;
        padding: 7px 10px;
        border: 1px solid transparent;
        border-radius: 8px;
        background: transparent;
        color: var(--ink-secondary);
        cursor: pointer;
        font-size: 0.74rem;
        font-weight: 750;
        white-space: nowrap;
      }

      .compact-tab:hover,
      .compact-tab.active {
        border-color: var(--line);
        background: var(--surface);
        color: var(--brand-navy);
      }

      .work-list {
        display: grid;
      }

      .work-item {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        align-items: center;
        gap: 14px;
        min-height: 78px;
        padding: 13px 18px;
        border: 0;
        border-bottom: 1px solid var(--line);
        background: var(--surface);
        cursor: pointer;
        text-align: left;
        transition: background var(--ease);
      }

      .work-item:last-child {
        border-bottom: 0;
      }

      .work-item:hover,
      .work-item.selected {
        background: var(--surface-muted);
      }

      .work-check {
        display: grid;
        width: 34px;
        height: 34px;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--surface-muted);
        color: var(--ink-secondary);
        font-size: 0.76rem;
        font-weight: 900;
      }

      .work-item-copy {
        min-width: 0;
      }

      .work-item-copy strong,
      .work-item-copy span {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .work-item-copy strong {
        margin-bottom: 4px;
        font-size: 0.86rem;
      }

      .work-item-copy span {
        color: var(--ink-secondary);
        font-size: 0.72rem;
      }

      .c-aside {
        display: grid;
        gap: 16px;
      }

      .mini-action-card {
        padding: 18px;
        border: 1px solid color-mix(in srgb, var(--brand-orange) 32%, var(--line));
        border-radius: var(--radius-lg);
        background: var(--brand-orange-soft);
      }

      .mini-action-card p {
        margin-bottom: 15px;
        color: var(--ink-secondary);
        font-size: 0.8rem;
      }

      .mini-action-card .btn {
        width: 100%;
      }

      .sidebar-overlay,
      .c-mobile-nav {
        display: none;
      }

      @media (max-width: 1180px) {
        .b-workspace {
          grid-template-columns: 185px minmax(0, 1fr);
        }

        .b-aside {
          grid-column: 2;
          grid-template-columns: 1fr 1fr;
        }

        .b-aside .state-panel {
          grid-column: 1 / -1;
        }

        .quick-grid {
          grid-template-columns: 1.35fr repeat(2, 1fr);
        }

        .quick-card:last-child {
          grid-column: 2 / 4;
        }
      }

      @media (max-width: 960px) {
        body {
          padding-bottom: 112px;
        }

        html[data-variant="C"] body {
          padding-bottom: 176px;
        }

        .deadline-hero {
          grid-template-columns: 1fr auto;
        }

        .deadline-hero .btn {
          grid-column: 1 / -1;
          width: 100%;
        }

        .a-grid,
        .c-grid {
          grid-template-columns: 1fr;
        }

        .a-aside,
        .c-aside {
          grid-template-columns: 1fr 1fr;
        }

        .a-aside .state-panel,
        .c-aside .state-panel {
          grid-column: 1 / -1;
        }

        .b-workspace {
          grid-template-columns: 1fr;
        }

        .filter-rail {
          position: static;
          overflow-x: auto;
          padding: 8px;
        }

        .filter-rail h2 {
          display: none;
        }

        .filter-stack {
          display: flex;
          min-width: max-content;
        }

        .filter-button {
          width: auto;
          min-width: 118px;
        }

        .b-aside {
          grid-column: auto;
        }

        .c-sidebar {
          transform: translateX(-100%);
        }

        .c-sidebar.open {
          box-shadow: 24px 0 52px rgba(0, 0, 0, 0.28);
          transform: translateX(0);
        }

        .sidebar-overlay {
          position: fixed;
          z-index: 60;
          inset: 0;
          display: block;
          border: 0;
          background: rgba(1, 20, 38, 0.54);
          cursor: pointer;
        }

        .c-main {
          margin-left: 0;
        }

        .c-menu-button {
          display: inline-grid;
        }

        .quick-grid {
          grid-template-columns: repeat(2, 1fr);
        }

        .quick-card:last-child {
          grid-column: auto;
        }

        .c-mobile-nav {
          position: fixed;
          z-index: 55;
          right: 12px;
          bottom: 94px;
          left: 12px;
          display: grid;
          grid-template-columns: repeat(4, 1fr);
          padding: 6px;
          border: 1px solid var(--line);
          border-radius: 15px;
          background: color-mix(in srgb, var(--surface) 94%, transparent);
          box-shadow: var(--shadow-card);
          backdrop-filter: blur(16px);
        }

        .c-mobile-nav a {
          display: grid;
          min-height: 45px;
          place-items: center;
          border-radius: 10px;
          color: var(--ink-secondary);
          font-size: 0.68rem;
          font-weight: 750;
        }

        .c-mobile-nav a.active {
          background: var(--surface-muted);
          color: var(--brand-navy);
        }
      }

      @media (max-width: 680px) {
        body {
          padding-bottom: 116px;
        }

        .topbar {
          min-height: 62px;
          padding: 0 14px;
        }

        .brand-text span,
        .student-chip span:last-child,
        .top-actions .pill {
          display: none;
        }

        .a-content,
        .b-content,
        .c-content {
          padding: 20px 14px 36px;
        }

        .a-intro,
        .c-intro,
        .section-head {
          align-items: flex-start;
          flex-direction: column;
        }

        .deadline-hero {
          grid-template-columns: 1fr;
          gap: 18px;
          padding: 20px;
          background: var(--brand-orange-soft);
        }

        .deadline-hero .btn {
          grid-column: auto;
        }

        .countdown {
          padding: 13px 0 0;
          border-top: 1px solid var(--line);
          border-left: 0;
        }

        .timeline-card {
          padding: 16px 12px;
        }

        .timeline::before {
          left: 30px;
        }

        .timeline-day {
          grid-template-columns: 52px 1fr;
          gap: 8px;
        }

        .date-node strong {
          width: 38px;
          height: 38px;
          line-height: 32px;
        }

        .timeline-task {
          grid-template-columns: 1fr;
          gap: 10px;
          padding: 13px;
        }

        .timeline-task .status-badge {
          justify-self: start;
        }

        .a-aside,
        .b-aside,
        .c-aside {
          grid-template-columns: 1fr;
        }

        .a-aside .state-panel,
        .b-aside .state-panel,
        .c-aside .state-panel {
          grid-column: auto;
        }

        .b-command {
          grid-template-columns: 1fr;
          padding: 18px;
        }

        .b-countdown {
          align-items: flex-start;
          flex-direction: column;
          gap: 9px;
        }

        .queue-toolbar {
          align-items: flex-start;
          flex-direction: column;
        }

        .detail-grid {
          grid-template-columns: 1fr;
        }

        .detail-grid .inline-actions {
          width: 100%;
        }

        .detail-grid .btn {
          flex: 1;
        }

        .context-strip {
          grid-template-columns: 1fr;
        }

        .quick-grid {
          grid-template-columns: 1fr;
        }

        .quick-card:last-child {
          grid-column: auto;
        }

        .search-shell {
          display: none;
        }

        .work-item {
          grid-template-columns: auto minmax(0, 1fr);
        }

        .work-item .status-badge {
          grid-column: 2;
          justify-self: start;
        }

        .prototype-switcher {
          bottom: 8px;
          min-height: 78px;
          grid-template-columns: 40px minmax(0, 1fr) 40px;
          gap: 7px;
          padding: 7px;
          border-radius: 16px;
        }

        .switch-arrow {
          width: 40px;
          height: 48px;
        }

        .switch-center {
          justify-content: center;
        }

        .switch-label {
          display: none;
        }

        .variant-buttons {
          width: 100%;
          justify-content: center;
        }

        .variant-btn {
          width: 42px;
          height: 42px;
        }

        .c-mobile-nav {
          bottom: 92px;
        }
      }

      @media (max-width: 390px) {
        .brand-text strong {
          max-width: 145px;
        }

        .top-actions {
          gap: 6px;
        }

        .student-chip {
          display: none;
        }

        .group-meta,
        .state-grid {
          grid-template-columns: 1fr;
        }

        .card-pad {
          padding: 17px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>
  <body>
    <main id="app"></main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <nav class="prototype-switcher" aria-label="原型切換器">
      <button class="switch-arrow" type="button" data-action="previous-variant" aria-label="上一個原型">
        ←
      </button>
      <div class="switch-center">
        <div class="switch-label">
          <strong>PROTOTYPE · 原型切換器</strong>
          <span id="switch-description">A · Timeline／截止日優先</span>
        </div>
        <div class="variant-buttons" aria-label="選擇原型版本">
          <button class="variant-btn" type="button" data-variant="A" aria-label="原型 A">A</button>
          <button class="variant-btn" type="button" data-variant="B" aria-label="原型 B">B</button>
          <button class="variant-btn" type="button" data-variant="C" aria-label="原型 C">C</button>
        </div>
      </div>
      <button class="switch-arrow" type="button" data-action="next-variant" aria-label="下一個原型">
        →
      </button>
    </nav>

    <script>
      (() => {
        "use strict";

        const VARIANTS = ["A", "B", "C"];
        const VARIANT_NAMES = {
          A: "Timeline／截止日優先",
          B: "待辦狀態工作區優先",
          C: "側欄＋快捷卡＋工作清單",
        };

        const fakeNow = new Date("2026-08-17T14:20:00+08:00");

        const data = {
          student: { name: "林若澄", id: "D112000000（虛構）" },
          nextDeadline: {
            title: "完成分組確認與本人同意",
            date: "2026-08-19T17:00:00+08:00",
            displayDate: "8 月 19 日（三）17:00",
            note: "五位組員皆已確認名單；尚待你完成本次線上同意。",
          },
          group: {
            number: "第 08 組",
            title: "校園活動智慧助理",
            type: "自選題",
            advisor: "王怡臻 副教授（虛構）",
            members: ["林若澄（我）", "陳冠宇", "張以安", "吳青禾", "周品謙"],
          },
          tasks: [
            {
              id: "task-consent",
              title: "本人線上同意",
              category: "分組簽核",
              due: "8/19 17:00",
              dateKey: "2026-08-19",
              status: "todo",
              summary: "確認專題題目、組別類型與五位成員名單後完成同意。",
              action: "consent",
            },
            {
              id: "task-resubmit",
              title: "個資使用同意書補正",
              category: "文件繳交",
              due: "8/20 23:59",
              dateKey: "2026-08-20",
              status: "resubmit",
              summary: "上次檔案缺少第二頁簽名，請合併成單一 PDF 後重新送出。",
              action: "resubmit",
            },
            {
              id: "task-proposal",
              title: "研究計畫書與系統規格",
              category: "共用草稿",
              due: "8/22 23:59",
              dateKey: "2026-08-22",
              status: "draft",
              summary: "目前為 v4 共用草稿；送出前仍可由全組共同編輯。",
              action: "submit",
            },
            {
              id: "task-group",
              title: "分組基本資料表",
              category: "分組管理",
              due: "8/15 17:00",
              dateKey: "2026-08-15",
              status: "submitted",
              summary: "已於 8/15 14:08 送出，回執編號 FJU-P08-0815。",
              action: "receipt",
            },
            {
              id: "task-poster",
              title: "專題海報初稿",
              category: "文件繳交",
              due: "8/28 23:59",
              dateKey: "2026-08-28",
              status: "todo",
              summary: "下載版型後上傳 PDF；本項目以組別為單位送出。",
              action: "start",
            },
            {
              id: "task-minutes",
              title: "第 2 次指導紀錄",
              category: "專題需求",
              due: "8/16 23:59",
              dateKey: "2026-08-16",
              status: "overdue",
              summary: "已逾期；請先補齊會議日期與三項結論，再送交全組確認。",
              action: "start",
            },
          ],
          announcements: [
            {
              date: "2026/08/16",
              title: "第二次文件繳交說明已更新",
              body: "補正檔案請合併為單一 PDF，檔名使用「組別－文件名稱」。",
              important: true,
            },
            {
              date: "2026/08/14",
              title: "產學合作說明會開放登記",
              body: "有興趣的組別可先閱讀合作題目，再由一位組員代表登記。",
              important: false,
            },
          ],
          versions: [
            {
              id: "v4",
              label: "v4",
              title: "補上資料流程與風險",
              author: "林若澄",
              time: "今天 14:18",
              state: "目前共用草稿",
            },
            {
              id: "v3",
              label: "v3",
              title: "調整使用情境",
              author: "張以安",
              time: "今天 11:05",
              state: "已儲存版本",
            },
            {
              id: "v2",
              label: "v2",
              title: "第一次整組校對",
              author: "吳青禾",
              time: "8/16 21:42",
              state: "已儲存版本",
            },
            {
              id: "v1",
              label: "v1",
              title: "建立文件骨架",
              author: "陳冠宇",
              time: "8/15 19:10",
              state: "已儲存版本",
            },
          ],
        };

        const initialVariant = new URLSearchParams(window.location.search)
          .get("variant")
          ?.toUpperCase();

        const state = {
          variant: VARIANTS.includes(initialVariant) ? initialVariant : "A",
          theme: "light",
          filter: "all",
          selectedTask: "task-consent",
          versionsExpanded: false,
          activeVersion: "v4",
          consented: false,
          autosave: "已儲存 · 14:18",
          receipt: null,
          lastAction: "尚未操作",
          menuOpen: false,
          taskStatus: Object.fromEntries(data.tasks.map((task) => [task.id, task.status])),
        };

        const statusLabels = {
          todo: "待完成",
          draft: "草稿",
          submitted: "已繳交",
          resubmit: "需重送",
          overdue: "已逾期",
        };

        const filterLabels = {
          all: "全部",
          todo: "待完成",
          draft: "草稿",
          submitted: "已繳交",
          resubmit: "需重送",
          overdue: "已逾期",
        };

        function countdown() {
          const end = new Date(data.nextDeadline.date);
          const totalHours = Math.max(0, Math.floor((end - fakeNow) / 3600000));
          const days = Math.floor(totalHours / 24);
          const hours = totalHours % 24;
          return `${days} 天 ${hours} 小時`;
        }

        function getTasks() {
          return data.tasks.map((task) => ({ ...task, status: state.taskStatus[task.id] }));
        }

        function filteredTasks() {
          const tasks = getTasks();
          return state.filter === "all" ? tasks : tasks.filter((task) => task.status === state.filter);
        }

        function countFor(status) {
          const tasks = getTasks();
          return status === "all" ? tasks.length : tasks.filter((task) => task.status === status).length;
        }

        function statusBadge(status) {
          return `<span class="status-badge status-${status}">${statusLabels[status]}</span>`;
        }

        function prototypePill() {
          return `<span class="pill prototype">PROTOTYPE · 全為虛構資料</span>`;
        }

        function themeButton() {
          const isDark = state.theme === "dark";
          return `
            <button class="icon-btn" type="button" data-action="toggle-theme" aria-label="切換為${
              isDark ? "淺色" : "深色"
            }主題" title="切換深淺主題">
              <span aria-hidden="true">${isDark ? "☀" : "☾"}</span>
            </button>`;
        }

        function studentChip() {
          return `
            <div class="student-chip" aria-label="目前學生帳號為虛構資料">
              <span class="avatar" aria-hidden="true">林</span>
              <span>${data.student.name}</span>
            </div>`;
        }

        function receiptMarkup() {
          if (!state.receipt) return "";
          return `
            <div class="receipt" role="status">
              <span class="receipt-mark" aria-hidden="true">✓</span>
              <div>
                <strong>${state.receipt.title}</strong>
                <p>${state.receipt.message}</p>
              </div>
            </div>`;
        }

        function groupCard(compact = false) {
          return `
            <section class="card card-pad" aria-labelledby="group-heading-${state.variant}">
              <div class="section-head">
                <div>
                  <div class="eyebrow">我的組別</div>
                  <h2 id="group-heading-${state.variant}">${data.group.number} · ${data.group.title}</h2>
                  <p>五位成員已完成名單確認</p>
                </div>
                <span class="status-badge status-submitted">5 / 5 已確認</span>
              </div>
              <div class="group-summary">
                <div class="progress-track" aria-label="成員確認進度 100%"><span></span></div>
                <div class="group-meta">
                  <div class="meta-box"><span>組別類型</span><strong>${data.group.type}</strong></div>
                  <div class="meta-box"><span>指導老師</span><strong>${data.group.advisor}</strong></div>
                </div>
                ${
                  compact
                    ? ""
                    : `<div class="member-list">${data.group.members
                        .map((member) => `<span class="member">${member}</span>`)
                        .join("")}</div>`
                }
              </div>
            </section>`;
        }

        function announcementsCard() {
          return `
            <section class="card card-pad" aria-labelledby="announcement-heading-${state.variant}">
              <div class="section-head">
                <div>
                  <div class="eyebrow">最新消息</div>
                  <h2 id="announcement-heading-${state.variant}">近期公告與規則</h2>
                </div>
                <span class="pill">2 則</span>
              </div>
              <ul class="announcement-list">
                ${data.announcements
                  .map(
                    (item) => `
                      <li class="announcement-item">
                        <time>${item.date}${item.important ? " · 重要" : ""}</time>
                        <strong>${item.title}</strong>
                        <p>${item.body}</p>
                      </li>`,
                  )
                  .join("")}
              </ul>
            </section>`;
        }

        function versionsCard() {
          const active = data.versions.find((version) => version.id === state.activeVersion);
          return `
            <section class="card card-pad" aria-labelledby="versions-heading-${state.variant}">
              <button
                class="btn btn-ghost version-toggle"
                type="button"
                data-action="toggle-versions"
                aria-expanded="${state.versionsExpanded}"
              >
                <span>
                  <span class="eyebrow">共用草稿</span>
                  <strong id="versions-heading-${state.variant}">版本紀錄</strong>
                </span>
                <span aria-hidden="true">${state.versionsExpanded ? "收合 ↑" : "展開 ↓"}</span>
              </button>
              <div class="version-summary">
                <div><strong>${active.label} · ${active.title}</strong><span>${active.author} · ${active.time}</span></div>
                <span class="pill">${active.state}</span>
              </div>
              ${
                state.versionsExpanded
                  ? `<div class="version-list">${data.versions
                      .map(
                        (version) => `
                          <button
                            class="version-button ${version.id === state.activeVersion ? "active" : ""}"
                            type="button"
                            data-version="${version.id}"
                            aria-pressed="${version.id === state.activeVersion}"
                          >
                            <span class="version-code">${version.label}</span>
                            <span class="version-copy"><strong>${version.title}</strong><span>${version.author}</span></span>
                            <time>${version.time}</time>
                          </button>`,
                      )
                      .join("")}</div>`
                  : ""
              }
            </section>`;
        }

        function statePanel() {
          const proposalStatus = statusLabels[state.taskStatus["task-proposal"]];
          return `
            <aside class="state-panel" aria-labelledby="state-heading-${state.variant}">
              <div class="card-pad">
                <div class="state-title">
                  <strong id="state-heading-${state.variant}">PROTOTYPE STATE</strong>
                  <span class="pill">即時</span>
                </div>
                <dl class="state-grid">
                  <div><dt>候選版</dt><dd>${state.variant} · ${VARIANT_NAMES[state.variant]}</dd></div>
                  <div><dt>主題</dt><dd>${state.theme === "dark" ? "深色" : "淺色"}</dd></div>
                  <div><dt>待辦篩選</dt><dd>${filterLabels[state.filter]}</dd></div>
                  <div><dt>檢視版本</dt><dd>${state.activeVersion.toUpperCase()}</dd></div>
                  <div><dt>本人同意</dt><dd>${state.consented ? "已模擬同意" : "尚待同意"}</dd></div>
                  <div><dt>研究計畫書</dt><dd>${proposalStatus}</dd></div>
                  <div><dt>草稿儲存</dt><dd>${state.autosave}</dd></div>
                  <div><dt>最後操作</dt><dd>${state.lastAction}</dd></div>
                </dl>
                <p class="state-note">所有變更只存在目前頁面記憶體；重新整理後會重置。無帳號、後端或真實送件。</p>
              </div>
            </aside>`;
        }

        function taskAction(task, wide = false) {
          if (task.id === "task-consent") {
            return `<button class="btn btn-orange" type="button" data-action="consent" ${
              state.consented ? "disabled" : ""
            }>${state.consented ? "已模擬同意" : "模擬本人同意"}</button>`;
          }
          if (task.id === "task-proposal") {
            const submitted = task.status === "submitted";
            return `
              <div class="inline-actions">
                <button class="btn btn-secondary" type="button" data-action="save-draft" ${submitted ? "disabled" : ""}>模擬儲存</button>
                <button class="btn btn-primary" type="button" data-action="submit-proposal" ${submitted ? "disabled" : ""}>${
                  submitted ? "已模擬送出" : "模擬送出"
                }</button>
              </div>`;
          }
          if (task.id === "task-resubmit") {
            return `<button class="btn btn-primary" type="button" data-action="resubmit" ${
              task.status === "submitted" ? "disabled" : ""
            }>${task.status === "submitted" ? "已模擬重送" : "模擬完成重送"}</button>`;
          }
          if (task.status === "todo" || task.status === "overdue") {
            return `<button class="btn btn-secondary" type="button" data-action="start-task" data-task-id="${task.id}">開始處理</button>`;
          }
          return wide ? `<span class="pill">可查看回執</span>` : "";
        }

        function filters(mode = "rail") {
          const statuses = ["all", "todo", "draft", "resubmit", "submitted", "overdue"];
          if (mode === "tabs") {
            return statuses
              .map(
                (status) => `
                  <button class="compact-tab ${state.filter === status ? "active" : ""}" type="button" data-filter="${status}">
                    ${filterLabels[status]} ${countFor(status)}
                  </button>`,
              )
              .join("");
          }
          return statuses
            .map(
              (status) => `
                <button class="filter-button ${state.filter === status ? "active" : ""}" type="button" data-filter="${status}" aria-pressed="${
                  state.filter === status
                }">
                  <span class="filter-dot ${status}" aria-hidden="true"></span>
                  <span>${filterLabels[status]}</span>
                  <span class="count-chip">${countFor(status)}</span>
                </button>`,
            )
            .join("");
        }

        function renderVariantA() {
          const tasksByDate = getTasks().reduce((groups, task) => {
            (groups[task.dateKey] ||= []).push(task);
            return groups;
          }, {});
          const dateLabels = {
            "2026-08-15": ["已過", "15"],
            "2026-08-16": ["逾期", "16"],
            "2026-08-19": ["週三", "19"],
            "2026-08-20": ["週四", "20"],
            "2026-08-22": ["週六", "22"],
            "2026-08-28": ["週五", "28"],
          };
          const dateOrder = ["2026-08-16", "2026-08-19", "2026-08-20", "2026-08-22", "2026-08-28", "2026-08-15"];
          const visibleDates = dateOrder.filter((date) => tasksByDate[date]);
          return `
            <div class="a-shell">
              <header class="topbar a-topbar">
                <div class="brand-lockup">
                  <span class="brand-mark" aria-hidden="true">FJU</span>
                  <div class="brand-text"><strong>資訊管理學系 · 專題平台</strong><span>學生 Dashboard · 原型 A</span></div>
                </div>
                <div class="top-actions">${prototypePill()}${themeButton()}${studentChip()}</div>
              </header>
              <div class="a-content">
                <section class="a-intro">
                  <div>
                    <div class="eyebrow">Timeline first</div>
                    <h1>${data.student.name}，先完成最近的一件事</h1>
                    <p>所有日期、姓名與回執均為原型假資料。</p>
                  </div>
                  <span class="pill">假資料基準 · 2026/08/17 14:20</span>
                </section>
                ${receiptMarkup()}
                <section class="deadline-hero" aria-labelledby="a-deadline-heading">
                  <div class="deadline-copy">
                    <span>下一個截止</span>
                    <h2 id="a-deadline-heading">${data.nextDeadline.title}</h2>
                    <p>${data.nextDeadline.displayDate} · ${data.nextDeadline.note}</p>
                  </div>
                  <div class="countdown"><span>剩餘時間</span><strong>${countdown()}</strong></div>
                  <button class="btn btn-orange" type="button" data-action="consent" ${state.consented ? "disabled" : ""}>
                    ${state.consented ? "已模擬同意" : "現在完成"} <span aria-hidden="true">→</span>
                  </button>
                </section>
                <div class="a-grid">
                  <section class="card timeline-card" aria-labelledby="timeline-heading">
                    <div class="section-head">
                      <div><div class="eyebrow">本期時間線</div><h2 id="timeline-heading">接下來要做什麼</h2><p>先看日期，再看每項工作的目前狀態。</p></div>
                      <span class="pill">${getTasks().length} 項工作</span>
                    </div>
                    <div class="timeline">
                      ${visibleDates
                        .map((date) => {
                          const dateTasks = tasksByDate[date];
                          const urgent = date === "2026-08-19" ? "urgent" : dateTasks.some((task) => task.status === "overdue") ? "overdue" : "";
                          return `
                            <div class="timeline-day ${urgent}">
                              <div class="date-node"><span>${dateLabels[date][0]}</span><strong>${dateLabels[date][1]}</strong></div>
                              <div class="timeline-items">
                                ${dateTasks
                                  .map(
                                    (task) => `
                                      <article class="timeline-task">
                                        <div>
                                          <h3>${task.title}</h3>
                                          <div class="task-subline"><span>${task.category}</span><span>截止 ${task.due}</span><span>${task.summary}</span></div>
                                        </div>
                                        ${statusBadge(task.status)}
                                      </article>`,
                                  )
                                  .join("")}
                              </div>
                            </div>`;
                        })
                        .join("")}
                    </div>
                  </section>
                  <div class="a-aside">
                    ${groupCard()}
                    ${announcementsCard()}
                    ${versionsCard()}
                    ${statePanel()}
                  </div>
                </div>
              </div>
            </div>`;
        }

        function queueRows() {
          const tasks = filteredTasks();
          if (!tasks.length) {
            return `<div class="empty-state"><span class="empty-mark">✓</span><h3>這個狀態目前沒有項目</h3><p class="muted">切換其他篩選條件，或用原型互動改變項目狀態。</p></div>`;
          }
          return tasks
            .map(
              (task) => `
                <button class="queue-row ${state.selectedTask === task.id ? "selected" : ""}" type="button" data-task="${task.id}">
                  <span class="queue-title"><strong>${task.title}</strong><span>${task.category} · ${task.summary}</span></span>
                  <span class="queue-due">${task.due}</span>
                  ${statusBadge(task.status)}
                  <span class="queue-open" aria-hidden="true">›</span>
                </button>`,
            )
            .join("");
        }

        function selectedTaskDetail() {
          const task = getTasks().find((item) => item.id === state.selectedTask) || filteredTasks()[0] || getTasks()[0];
          if (!task) return "";
          return `
            <section class="card detail-drawer" aria-labelledby="detail-heading">
              <div class="detail-grid">
                <div>
                  <div class="eyebrow">目前選取</div>
                  <h2 id="detail-heading">${task.title}</h2>
                  <p>${task.summary}</p>
                  <div class="detail-facts">${statusBadge(task.status)}<span class="pill">${task.category}</span><span class="pill">截止 ${task.due}</span></div>
                </div>
                ${taskAction(task, true)}
              </div>
            </section>`;
        }

        function renderVariantB() {
          return `
            <div class="b-shell">
              <header class="topbar b-topbar">
                <div class="brand-lockup">
                  <span class="brand-mark" aria-hidden="true">FJU</span>
                  <div class="brand-text"><strong>專題事務工作區</strong><span>學生 Dashboard · 原型 B</span></div>
                </div>
                <div class="top-actions">${prototypePill()}${themeButton()}${studentChip()}</div>
              </header>
              <div class="b-content">
                ${receiptMarkup()}
                <section class="b-command" aria-labelledby="b-heading">
                  <div>
                    <div class="eyebrow">你的下一步</div>
                    <h1 id="b-heading">${state.consented ? "本人同意已完成，接著處理補正文件" : data.nextDeadline.title}</h1>
                    <p>${data.nextDeadline.displayDate} · ${data.group.number}／${data.group.title}</p>
                  </div>
                  <div class="b-countdown">
                    <strong>${countdown()}</strong>
                    <button class="btn btn-orange" type="button" data-action="consent" ${state.consented ? "disabled" : ""}>${
                      state.consented ? "已模擬同意" : "模擬本人同意"
                    }</button>
                  </div>
                </section>
                <div class="b-workspace">
                  <aside class="card filter-rail" aria-label="待辦狀態篩選">
                    <h2>工作狀態</h2>
                    <div class="filter-stack">${filters("rail")}</div>
                  </aside>
                  <div class="workspace-main">
                    <section class="card queue-card" aria-labelledby="queue-heading">
                      <div class="queue-toolbar">
                        <div><div class="eyebrow">Task workspace</div><h2 id="queue-heading">${filterLabels[state.filter]}工作</h2><p>選取項目後，可在下方模擬儲存、同意或送出。</p></div>
                        <span class="pill">顯示 ${filteredTasks().length} / ${getTasks().length}</span>
                      </div>
                      <div class="queue-scroll" role="region" aria-label="可水平捲動的工作清單" tabindex="0">
                        <div class="queue-head"><span>工作</span><span>截止</span><span>狀態</span><span></span></div>
                        ${queueRows()}
                      </div>
                    </section>
                    ${selectedTaskDetail()}
                    <div class="context-strip" aria-label="組別摘要">
                      <div class="context-mini"><span>五人確認</span><strong>5 / 5 已確認</strong></div>
                      <div class="context-mini"><span>指導老師</span><strong>${data.group.advisor}</strong></div>
                      <div class="context-mini"><span>組別類型</span><strong>${data.group.type} · ${data.group.number}</strong></div>
                    </div>
                  </div>
                  <aside class="b-aside">
                    ${versionsCard()}
                    ${announcementsCard()}
                    ${statePanel()}
                  </aside>
                </div>
              </div>
            </div>`;
        }

        function workItems() {
          const tasks = filteredTasks();
          if (!tasks.length) {
            return `<div class="empty-state"><span class="empty-mark">✓</span><h3>目前沒有${filterLabels[state.filter]}項目</h3><p class="muted">換一個篩選條件繼續查看。</p></div>`;
          }
          return tasks
            .map(
              (task) => `
                <button class="work-item ${state.selectedTask === task.id ? "selected" : ""}" type="button" data-task="${task.id}">
                  <span class="work-check" aria-hidden="true">${task.status === "submitted" ? "✓" : task.status === "resubmit" ? "!" : "·"}</span>
                  <span class="work-item-copy"><strong>${task.title}</strong><span>${task.category} · 截止 ${task.due}</span></span>
                  ${statusBadge(task.status)}
                </button>`,
            )
            .join("");
        }

        function renderVariantC() {
          const pendingCount = countFor("todo") + countFor("resubmit") + countFor("overdue");
          return `
            <div class="c-app">
              ${state.menuOpen ? '<button class="sidebar-overlay" type="button" data-action="toggle-menu" aria-label="關閉側欄"></button>' : ""}
              <aside class="c-sidebar ${state.menuOpen ? "open" : ""}" aria-label="主要導覽">
                <div class="brand-lockup">
                  <span class="brand-mark" aria-hidden="true">FJU</span>
                  <div class="brand-text"><strong>資管專題平台</strong><span>Student workspace</span></div>
                </div>
                <div class="c-nav-label">工作區</div>
                <nav class="c-nav">
                  <a class="active" href="#c-overview" data-action="close-menu"><span class="nav-icon">⌂</span>總覽</a>
                  <a href="#work-list" data-action="close-menu"><span class="nav-icon">✓</span>我的工作 <span class="count-chip">${pendingCount}</span></a>
                  <a href="#group-card" data-action="close-menu"><span class="nav-icon">5</span>我的組別</a>
                  <a href="#versions-card" data-action="close-menu"><span class="nav-icon">V</span>共用草稿</a>
                </nav>
                <div class="c-nav-label">其他入口</div>
                <nav class="c-nav">
                  <a href="#announcements" data-action="close-menu"><span class="nav-icon">i</span>公告與規則</a>
                  <a href="#industry" data-action="close-menu"><span class="nav-icon">↗</span>產學合作</a>
                </nav>
                <div class="c-sidebar-foot"><strong>PROTOTYPE ONLY</strong><span>全為虛構資料，互動不會送到任何伺服器。</span></div>
              </aside>
              <div class="c-main">
                <header class="topbar c-topbar">
                  <div class="top-actions">
                    <button class="icon-btn c-menu-button" type="button" data-action="toggle-menu" aria-label="開啟側欄">☰</button>
                    <label class="search-shell"><span aria-hidden="true">⌕</span><span class="sr-only">搜尋功能未在本原型啟用</span><input type="search" placeholder="搜尋（本原型未啟用）" disabled aria-disabled="true" /></label>
                  </div>
                  <div class="top-actions">${prototypePill()}${themeButton()}${studentChip()}</div>
                </header>
                <div class="c-content" id="c-overview">
                  <section class="c-intro">
                    <div><div class="eyebrow">Student overview</div><h1>午安，${data.student.name}</h1><p>先完成有期限的工作，再查看組別與公告。</p></div>
                    <span class="pill">原型 C · 假資料基準 8/17</span>
                  </section>
                  ${receiptMarkup()}
                  <section class="quick-grid" aria-label="快捷摘要卡">
                    <article class="quick-card primary">
                      <div class="quick-top"><span class="quick-icon">D</span><span class="status-badge status-todo">下一截止</span></div>
                      <small>${data.nextDeadline.displayDate}</small><strong>${data.nextDeadline.title}</strong><span>剩餘 ${countdown()}</span>
                    </article>
                    <article class="quick-card">
                      <div class="quick-top"><span class="quick-icon">5</span><span class="pill">完整</span></div>
                      <small>組別確認</small><strong>5 / 5 位</strong><span>${data.group.number} · ${data.group.type}</span>
                    </article>
                    <article class="quick-card">
                      <div class="quick-top"><span class="quick-icon">S</span><span class="pill">待處理</span></div>
                      <small>本人同意</small><strong>${state.consented ? "已模擬同意" : "尚待同意"}</strong><span>${state.consented ? "狀態已在本頁更新" : "完成後全組流程可繼續"}</span>
                    </article>
                    <article class="quick-card" id="industry">
                      <div class="quick-top"><span class="quick-icon">I</span><span class="pill">入口</span></div>
                      <small>產學合作</small><strong>瀏覽合作題目</strong><span>公開題目與說明會資訊</span>
                    </article>
                  </section>
                  <div class="c-grid">
                    <div>
                      <section class="card work-card" id="work-list" aria-labelledby="work-list-heading">
                        <div class="section-head">
                          <div><div class="eyebrow">Work list</div><h2 id="work-list-heading">我的工作清單</h2><p>共 ${getTasks().length} 項；狀態變更會立即反映在快捷卡。</p></div>
                          <span class="pill">${pendingCount} 項需留意</span>
                        </div>
                        <div class="compact-tabs">${filters("tabs")}</div>
                        <div class="work-list">${workItems()}</div>
                      </section>
                      ${selectedTaskDetail()}
                      <div id="group-card" style="margin-top: 16px">${groupCard(true)}</div>
                    </div>
                    <aside class="c-aside">
                      <section class="mini-action-card" aria-labelledby="quick-action-heading">
                        <div class="eyebrow">建議下一步</div>
                        <h2 id="quick-action-heading">${state.consented ? "補正個資使用同意書" : "完成本人線上同意"}</h2>
                        <p>${state.consented ? "補上第二頁簽名，合併 PDF 後模擬重送。" : "名單已 5 / 5 確認；請確認題目與成員後完成同意。"}</p>
                        <button class="btn btn-orange" type="button" data-action="${state.consented ? "resubmit" : "consent"}">${
                          state.consented ? "模擬完成重送" : "模擬本人同意"
                        }</button>
                      </section>
                      <div id="versions-card">${versionsCard()}</div>
                      <div id="announcements">${announcementsCard()}</div>
                      ${statePanel()}
                    </aside>
                  </div>
                </div>
              </div>
              <nav class="c-mobile-nav" aria-label="手機快速導覽">
                <a class="active" href="#c-overview">總覽</a><a href="#work-list">工作</a><a href="#group-card">組別</a><a href="#versions-card">草稿</a>
              </nav>
            </div>`;
