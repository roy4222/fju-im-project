# 兩站健康巡檢（設計方案 §6）。每 10 分鐘打一次 /api/health，掛了 job 變紅，
# 排程的失敗通知寄給建立 workflow、最後修改 cron 或重新啟用它的人（Roy 要確認自己是收件者，並開「Actions: failed workflows only」通知）。
#
# 頻率照定案 10 分鐘，與契約 05 §8 的 5 分鐘不同，Vault 回寫時對齊。
# 正式站那一半由 repository variable HEALTH_PROD_ENABLED 控制：沒設＝skipped，開站當天設 `true`。
# 網址以 ops/Caddyfile.vm 為準。
# 注意：repo 60 天沒 commit，GitHub 會自動停用排程 workflow。
name: health-cron

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      test_url:
        description: '測試站巡檢網址（留空＝正式網址；填一個會失敗的網址可用來試通知）'
        required: false
        default: ''

concurrency:
  group: health-cron
  cancel-in-progress: false

permissions: {}

env:
  # 共用檢查：HTTP 200 且傳輸完整、ok === true、commit 是非空字串、worker.lastTickAt 在 5 分鐘內
  # （web/src/shared/health.ts：超過 WORKER_STALE_AFTER_MS 才算停擺，所以恰好 300 秒仍算活著）。
  # lastTickAt 是 toISOString() 格式（帶 .123Z），fromdateiso8601 不吃小數秒，先拆出小數秒再加回；
  # null 或格式不符時 jq 沒有輸出，-e 會失敗。curl 的 retry 近似契約的「連續 3 次」。
  # 呼叫寫成 `bash -c "$CHECK" check <url>`：bash -c 後第一個參數是 $0，§6 骨架少了 `check` 這個 $0 佔位，url 會變空。
  CHECK: |
    url=$1
    code=$(curl -s -o body.json -w '%{http_code}' --retry 3 --retry-delay 30 --retry-all-errors "$url"); rc=$?
    echo "$url -> HTTP $code (curl exit $rc)"; cat body.json 2>/dev/null; echo
    echo "detail=HTTP $code（curl 結束碼 $rc）" >> "$GITHUB_OUTPUT"
    [ "$rc" = 0 ] && [ "$code" = 200 ] || exit 1
    jq -e '.ok == true
           and (.commit | type == "string" and length > 0)
           and (.worker.lastTickAt | type == "string")
           and (.worker.lastTickAt
                | capture("^(?<base>[^.]+)(?<frac>\\.[0-9]+)?Z$")
                | ((.base + "Z") | fromdateiso8601) + (("0" + (.frac // "")) | tonumber)
                | now - . <= 300)' body.json

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      detail: ${{ steps.check.outputs.detail }}
    steps:
      - id: check
        env:
          TEST_URL: ${{ inputs.test_url }}
        run: bash -c "$CHECK" check "${TEST_URL:-https://test.fju.roy422.dev/api/health}"

  prod:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # job 層的 if 看不到 matrix，所以拆兩個 job。
    if: vars.HEALTH_PROD_ENABLED == 'true'
    outputs:
      detail: ${{ steps.check.outputs.detail }}
    steps:
      - id: check
        run: bash -c "$CHECK" check https://fju.roy422.dev/api/health

  # 失敗與恢復通知到 Discord（設計方案 §5.2）。純文字、不帶 @mention。
  # job 層的 if 讀不到 secrets，所以 secret 沒設（fork、或還沒建）時由第一個 step 判斷，其餘 step 略過，
  # 巡檢本身的結論不受影響。連續失敗每 10 分鐘各送一則，不做抑制。
  notify:
    needs: [test, prod]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      GH_TOKEN: ${{ github.token }}
      TEST_RESULT: ${{ needs.test.result }}
      TEST_DETAIL: ${{ needs.test.outputs.detail }}
      PROD_RESULT: ${{ needs.prod.result }}
      PROD_DETAIL: ${{ needs.prod.outputs.detail }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: 有沒有設 DISCORD_WEBHOOK_URL
        id: gate
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::notice::DISCORD_WEBHOOK_URL 未設，略過通知。"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 失敗或恢復就送 Discord
        if: steps.gate.outputs.enabled == 'true'
        run: |
          set -u
          now_utc=$(TZ=UTC date '+%Y-%m-%d %H:%M UTC')
          now_tw=$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M 台灣時間')
          lines=""
          add() { # 站名 結論 細節
            case "$2" in
              success|skipped) ;;
              *) lines="${lines}- $1：$3（job 結論：$2）"$'\n' ;;
            esac
          }
          add 測試站 "$TEST_RESULT" "${TEST_DETAIL:-沒有回應（逾時或 job 被取消）}"
          add 正式站 "$PROD_RESULT" "${PROD_DETAIL:-沒有回應（逾時或 job 被取消）}"

          if [ -n "$lines" ]; then
            msg=$(printf '🔴 健康檢查失敗\n%s時間：%s／%s\nrun：%s' "$lines" "$now_utc" "$now_tw" "$RUN_URL")
          else
            # 這次全綠：看同一 workflow 上一次「已完成的排程 run」是不是失敗。
            prev=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/health-cron.yml/runs?event=schedule&status=completed&per_page=5" \
              --jq "[.workflow_runs[] | select(.id != ${GITHUB_RUN_ID})][0].conclusion // \"\"")
            echo "上一次排程 run 結論：${prev:-（查不到）}"
            if [ "$prev" != failure ]; then
              echo "沒有要通知的事。"; exit 0
            fi
            msg=$(printf '🟢 健康檢查已恢復\n時間：%s／%s\nrun：%s' "$now_utc" "$now_tw" "$RUN_URL")
          fi

          jq -n --arg content "$msg" '{content: $content, allowed_mentions: {parse: []}}' \
            | curl -sS --fail-with-body --retry 3 --max-time 20 -H 'Content-Type: application/json' -d @- "$DISCORD_WEBHOOK_URL" > /dev/null
          echo "已送出 Discord 通知"
