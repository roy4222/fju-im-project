# 開發者後台（status/）的 CI 與映像（設計方案 §3.6）。
#
# 不放進 ci.yml：那裡的七道 job 名稱是 main 的 required checks（契約 05 §2），而且裝的是
# 根目錄 workspace；status/ 是獨立專案（不在 pnpm-workspace.yaml、自己的 lockfile），
# 所以安裝與執行一律加 --ignore-workspace。
#
#   status-check        PR 與 main：typecheck、lint、test、build 四個獨立 step，再跑 docs/status 格式檢查
#   status-image-smoke  PR 與 main：建映像（不推），實際啟動三種東西確認入口都在
#   status-image        只在 main：建置並推 ghcr.io/roy4222/fju-status:<完整 SHA> 與 :main
name: Status

on:
  pull_request:
    # 兩份清單要一樣：會影響後台的檔都列（S-4、S-7、S-8、S-9 的 ops 改動才會跑到 status/test/ops）。
    paths:
      - 'status/**'
      - 'docs/status/**'
      - 'docker-compose.status.yml'
      - 'ops/status-*.sh'
      - 'ops/status/**'
      - 'ops/acceptance-night.sh'
      - 'ops/fju-test-reset'
      - 'ops/fju-test-reset-gate'
      - 'ops/ssh-config.example'
      - '.github/workflows/health-cron.yml'
      - '.github/workflows/status.yml'
  push:
    branches: [main]
    paths:
      - 'status/**'
      - 'docs/status/**'
      - 'docker-compose.status.yml'
      - 'ops/status-*.sh'
      - 'ops/status/**'
      - 'ops/acceptance-night.sh'
      - 'ops/fju-test-reset'
      - 'ops/fju-test-reset-gate'
      - 'ops/ssh-config.example'
      - '.github/workflows/health-cron.yml'
      - '.github/workflows/status.yml'

concurrency:
  group: status-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: '22.23.2'
  PNPM_VERSION: '11.0.9'

jobs:
  status-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: status
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: status/pnpm-lock.yaml
      - run: pnpm install --ignore-workspace --frozen-lockfile
      # 四道分開成四個 step：寫成 `pnpm typecheck lint test build` 只會跑 typecheck、其餘變參數。
      - name: typecheck
        run: pnpm --ignore-workspace run typecheck
      - name: lint
        run: pnpm --ignore-workspace run lint
      - name: test
        run: pnpm --ignore-workspace run test
      - name: build
        run: pnpm --ignore-workspace run build
      # 人維護的設定檔格式（S-2）。S-2 合併前檔案還不在，先跳過。
      - name: docs/status 格式檢查
        working-directory: .
        run: |
          if [ -f docs/status/check.mjs ]; then
            node docs/status/check.mjs
          else
            echo "docs/status/check.mjs 還不存在（S-2 未合併），跳過"
          fi

  status-image-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: 建映像（不推）
        uses: docker/build-push-action@v6
        with:
          context: status
          file: status/Dockerfile
          load: true
          push: false
          tags: fju-status:ci
          cache-from: type=gha,scope=fju-status
          cache-to: type=gha,mode=max,scope=fju-status
      - name: 三種入口都在
        run: |
          docker run --rm fju-status:ci sh -c 'test -f server.js && test -d collector && test -d proxy && test -f verify-origin.mjs && ! test -e fixtures'
      - name: status-web：/healthz 200、其他路徑沒有 JWT 一律 403
        run: |
          set -eu
          docker run -d --name web -p 127.0.0.1:3000:3000 \
            -e ACCESS_TEAM_DOMAIN=ci-test.cloudflareaccess.com -e ACCESS_AUD=ci-aud \
            -e STATUS_DEV_BYPASS_ACCESS=1 fju-status:ci
          for i in $(seq 1 30); do
            [ "$(curl -s http://127.0.0.1:3000/healthz || true)" = ok ] && break
            sleep 1
          done
          test "$(curl -s http://127.0.0.1:3000/healthz)" = ok
          for p in / /map /go-live /_next/static/x.js; do
            code="$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3000${p}")"
            echo "${p} → ${code}"
            test "${code}" = 403
          done
      - name: verify-origin：/probe 累加、/count 唯讀
        run: |
          set -eu
          docker run -d --name origin -p 127.0.0.1:8080:8080 fju-status:ci node verify-origin.mjs
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/count >/dev/null && break
            sleep 1
          done
          for i in 1 2 3; do test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/probe)" = 204; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/x)" = 404
          test "$(curl -s http://127.0.0.1:8080/count)" = 3
          test "$(curl -s http://127.0.0.1:8080/count)" = 3
      - name: 失敗時印容器 log
        if: failure()
        run: |
          docker logs web || true
          docker logs origin || true

  status-image:
    # 只發布 main：手動或從別的分支推會讓 :main 指到非 main 的 SHA。
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [status-check, status-image-smoke]
    runs-on: ubuntu-latest
    # 只有這個 job 能寫 GHCR（跟 image.yml 一樣用 GITHUB_TOKEN，不放大 workflow 預設權限）。
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 建置並推送 ghcr.io/roy4222/fju-status
        uses: docker/build-push-action@v6
        with:
          context: status
          file: status/Dockerfile
          push: true
          tags: |
            ghcr.io/roy4222/fju-status:${{ github.sha }}
            ghcr.io/roy4222/fju-status:main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=fju-status
          cache-to: type=gha,mode=max,scope=fju-status
