# CI 七道門檻（契約 05 §2）。job 名稱固定：
# typecheck、lint、unit、integration、build、e2e-smoke、audit。
# 這七道都要設成 main 的 required checks（branch protection 由 Roy 在 GitHub 設定）。
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22.23.2'
  PNPM_VERSION: '11.0.9'

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @fju/web...
      - run: pnpm -C web typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @fju/web...
      - run: pnpm -C web lint
      # 分層邊界的正反例：規則被改壞時這一步會紅（契約 05 §2「含邊界反例測試」）。
      - run: pnpm -C web lint:boundaries-test
      # migration 的 GRANT 必須與權限矩陣一致（契約 01 §5：GRANT 由矩陣產生，不手寫）。
      - run: pnpm -C web db:grants --check

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @fju/web...
      - run: pnpm -C web test:unit

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_USER: fju_owner
          POSTGRES_PASSWORD: fju_ci
          POSTGRES_DB: fju
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fju_owner -d fju"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://fju_owner:fju_ci@127.0.0.1:5432/fju
      DATABASE_URL_OWNER: postgres://fju_owner:fju_ci@127.0.0.1:5432/fju
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @fju/web...
      # 三個憑證檔是 gitignore 的（值由維運帶入），但 `docker compose config` 要求檔案存在。
      # CI 用 .env.example 的空範本補上，只是為了讓 Compose 定義解析得起來。
      - name: 補上 Compose 需要的空憑證檔
        run: |
          cp .env.example .env
          cp .env.example .env.migrate
          cp .env.example .env.backup
      # 空庫 migration、fju_app 逐表權限拒絕測試、harness 自測、health、Compose 定義
      # 都在這一道（契約 05 §2）。
      - run: pnpm -C web test:integration

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @fju/web...
      - run: pnpm -C web build
        env:
          GIT_COMMIT: ${{ github.sha }}
          APP_VERSION: ${{ github.sha }}
      # 映像本身也要建得起來（app、worker、migrate 共用）。S00 只 build，不推 GHCR。
      - run: docker build -f web/Dockerfile --build-arg GIT_COMMIT=${{ github.sha }} -t fju-web:ci .

  e2e-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_USER: fju_owner
          POSTGRES_PASSWORD: fju_ci
          POSTGRES_DB: fju
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fju_owner -d fju"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL_OWNER: postgres://fju_owner:fju_ci@127.0.0.1:5432/fju
      DATABASE_URL: postgres://fju_app:fju_ci_app@127.0.0.1:5432/fju
      BASE_URL: http://127.0.0.1:3000
      GIT_COMMIT: ${{ github.sha }}
      APP_VERSION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @fju/web...
      - run: pnpm -C web db:migrate
      # migration 建了 fju_app 但不設密碼（密碼是維運的事）；CI 這邊自己給一個。
      - name: 設定 CI 的 fju_app 密碼
        run: psql "$DATABASE_URL_OWNER" -c "ALTER ROLE fju_app PASSWORD 'fju_ci_app'"
      - run: pnpm -C web build
      - run: pnpm -C web exec playwright install --with-deps chromium
      - name: 起 app 並等 health 綠
        run: |
          pnpm -C web start &
          for i in $(seq 1 60); do
            if curl -sf "$BASE_URL/api/health" > /dev/null; then echo "app ready"; exit 0; fi
            sleep 2
          done
          echo "app 在 120 秒內沒有起來"; exit 1
      - run: pnpm -C web test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-artifacts
          path: web/e2e/.artifacts
          retention-days: 7

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @fju/web...
      # 契約 03 §8：依賴稽核。high 以上就擋，但只看會進到 web/ 的相依路徑——
      # prototype/ 是評選用的可點原型，它的洞另案處理，不擋正式碼的 PR。
      - name: pnpm audit（只擋影響 web/ 的 high 以上）
        run: |
          pnpm audit --json > audit.json || true
          node web/scripts/audit-check.mjs --level high < audit.json
