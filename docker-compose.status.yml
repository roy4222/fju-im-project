# 開發者後台（fju-status.roy422.dev）的 compose（設計方案 §3.6、§3.7、§3.13；S-4）。
#
# 跟主網站完全分開：自己的 project（fju-status）、自己的網路，主網站的 compose 與 Caddy 一個字都不動。
# 外面只透過 Cloudflare Tunnel 進來（cloudflared 主動往外連），所以：
#   - 任何服務都不發布 port（不寫 ports）。
#   - 每個服務都有 mem_limit（合計約 1.25 GB，§3.7）。
#   - 映像一律固定版本；自己的 fju-status 映像用 main（每 10 分鐘由 ops/status-up.sh 拉新的）或完整 SHA。
#
# Docker socket 只有 docker-proxy 碰得到（status/proxy/docker-proxy.mjs：端點白名單、inspect 欄位白名單）。
# dozzle、beszel-agent 用 DOCKER_HOST=tcp://docker-proxy:2375，跟它一起待在 internal 網路 fju-status-docker。
#
# 不要直接下 docker compose：一律經 ops/status-up.sh（deploy 身分，fju-status-update.timer 每 10 分鐘跑）。
# 秘密檔放 /srv/fju/status/secrets（deploy 700、檔案 600，安裝腳本 ops/status-install.sh 建）：
#   status.env        ACCESS_TEAM_DOMAIN、ACCESS_AUD（給 status-web 驗 Access JWT）
#   pghero.env        DATABASE_URL（fju_monitor 唯讀角色）、FJU_MONITOR_PASSWORD（不加引號；ops/status-up.sh 讀它補建角色）
#   beszel-agent.env  KEY（Beszel hub 產生的公鑰；hub 第一次起來後才有，所以 required: false）
#   tunnel.json       Cloudflare Tunnel 憑證
# FJU_STATUS_SECRETS 只給測試把秘密目錄換成暫存目錄用；VM 上不設。
name: fju-status

x-common: &common
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '5'

x-status-image: &status-image ghcr.io/roy4222/fju-status:${FJU_STATUS_IMAGE_TAG:-main}

services:
  # 自寫三頁（Next.js standalone）。自己再驗一次 Access JWT（§3.2），/healthz 例外。
  status-web:
    <<: *common
    image: *status-image
    command: ['node', 'server.js']
    env_file:
      - ${FJU_STATUS_SECRETS:-/srv/fju/status/secrets}/status.env
    environment:
      NODE_ENV: production
      PORT: '3000'
      HOSTNAME: '0.0.0.0'
      STATUS_DATA_DIR: /data
      STATUS_ACCEPTANCE_DIR: /acceptance
    volumes:
      - /srv/fju/status/data:/data:ro
      - /srv/fju/status/inbox:/acceptance:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    mem_limit: 256m
    cpus: 0.5
    networks: [fju-status]
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # 每 10 分鐘把 GitHub、Gatus、部署與備份紀錄整理成 /data/*.json（§3.3）。
  # 容器內 root，但只留 DAC_READ_SEARCH（讀得到別人 700 的目錄、改不了），根檔案系統唯讀，只有 /data 可寫。
  # 主網站目錄掛在跟 VM 上相同的路徑（唯讀）。
  collector:
    <<: *common
    image: *status-image
    command: ['node', 'collector/collect.mjs', '--loop', '600']
    user: '0:0'
    environment:
      STATUS_DATA_DIR: /data
      STATUS_ACCEPTANCE_DIR: /srv/fju/status/inbox
      GATUS_URL: http://gatus:8080
    volumes:
      - /srv/fju/status/data:/data
      - /srv/fju/test/deploy:/srv/fju/test/deploy:ro
      - /srv/fju/prod/deploy:/srv/fju/prod/deploy:ro
      - /srv/fju/test/backups:/srv/fju/test/backups:ro
      - /srv/fju/prod/backups:/srv/fju/prod/backups:ro
      - /srv/fju/offsite:/srv/fju/offsite:ro
      - /srv/fju/status/envcheck:/srv/fju/status/envcheck:ro
      - /srv/fju/status/inbox:/srv/fju/status/inbox:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    cap_add: [DAC_READ_SEARCH]
    mem_limit: 96m
    cpus: 0.25
    networks: [fju-status]

  # 健康檢查引擎，只在內部（不建對外網址、不設警報）。設定檔歸 S-3（ops/status/gatus.yml）。
  gatus:
    <<: *common
    image: twinproduction/gatus:v5.37.0
    environment:
      GATUS_CONFIG_PATH: /config/config.yaml
    volumes:
      - ./ops/status/gatus.yml:/config/config.yaml:ro
      - gatus_data:/data
    mem_limit: 64m
    cpus: 0.25
    networks: [fju-status]

  # Beszel hub（VM 與容器資源）。保留自己的登入（Roy 第一次開時建帳號）。
  # 跟 agent 只透過共用 volume beszel_socket 裡的 unix socket 溝通，「新增系統」填 /beszel_socket/beszel.sock。
  beszel:
    <<: *common
    image: henrygd/beszel:0.21.0
    volumes:
      - beszel_data:/beszel_data
      - beszel_socket:/beszel_socket
    mem_limit: 128m
    cpus: 0.25
    networks: [fju-status]

  # Beszel agent：不掛 socket、不用 network_mode: host、不開 TCP port（LISTEN 是 unix socket）。
  # 掛載恰好三項（AC-S-6）：磁碟容量用專用空目錄 diskprobe（statfs 量到整顆根磁碟、裡面什麼都沒有）、
  # 跟 hub 共用的 beszel_socket、映像自帶 VOLUME 的具名版 beszel_agent_data（不寫就會變匿名 volume）。
  beszel-agent:
    <<: *common
    image: henrygd/beszel-agent:0.21.0
    env_file:
      - path: ${FJU_STATUS_SECRETS:-/srv/fju/status/secrets}/beszel-agent.env
        required: false
    environment:
      LISTEN: /beszel_socket/beszel.sock
      DOCKER_HOST: tcp://docker-proxy:2375
    volumes:
      - type: bind
        source: /srv/fju/status/diskprobe
        target: /extra-filesystems/root
        read_only: true
      - type: volume
        source: beszel_socket
        target: /beszel_socket
      - type: volume
        source: beszel_agent_data
        target: /var/lib/beszel-agent
    mem_limit: 64m
    cpus: 0.25
    networks: [fju-status-docker]
    depends_on: [docker-proxy]

  # 唯一掛原始 Docker socket 的容器：自寫的白名單代理（status/proxy/docker-proxy.mjs）。
  # socket 屬 root:docker 660，所以用容器內 root（擁有者權限就夠），能力全拿掉、根檔案系統唯讀。
  # 只接 internal 網路 fju-status-docker：成員只有它、dozzle、beszel-agent，連不到外網。
  docker-proxy:
    <<: *common
    image: *status-image
    command: ['node', 'proxy/docker-proxy.mjs']
    user: '0:0'
    environment:
      DOCKER_PROXY_SOCKET: /var/run/docker.sock
      DOCKER_PROXY_PORT: '2375'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    cap_drop: [ALL]
    mem_limit: 48m
    cpus: 0.25
    networks: [fju-status-docker]

  # 容器 log。身分用 Access 傳來的信箱（forward-proxy）；容器不發布 port、唯一入口是隧道，header 偽造不了。
  # 主機代號寫死：docker-proxy 的 /info 不回 ID 與主機名，Dozzle 沒有它們就得不到主機代號。
  dozzle:
    <<: *common
    image: amir20/dozzle:v11.1.1
    environment:
      DOCKER_HOST: tcp://docker-proxy:2375
      DOZZLE_AUTH_PROVIDER: forward-proxy
      DOZZLE_AUTH_HEADER_USER: Cf-Access-Authenticated-User-Email
      DOZZLE_AUTH_HEADER_EMAIL: Cf-Access-Authenticated-User-Email
      DOZZLE_AUTH_HEADER_NAME: Cf-Access-Authenticated-User-Email
      DOZZLE_ENABLE_ACTIONS: 'false'
      DOZZLE_ENABLE_SHELL: 'false'
      DOZZLE_HOST_ID: fju-vm
      DOZZLE_HOSTNAME: fju-vm
      DOZZLE_NO_ANALYTICS: 'true'
    mem_limit: 96m
    cpus: 0.25
    networks: [fju-status, fju-status-docker]
    depends_on: [docker-proxy]

  # 測試站資料庫（fju_monitor 角色只有 pg_monitor 與 CONNECT，讀不到資料表內容）。
  # 只接測試站的網路；正式站開站後另開小票（現在加會讓 compose 在正式站沒起時起不來）。
  pghero:
    <<: *common
    image: ankane/pghero:v3.7.0
    env_file:
      - ${FJU_STATUS_SECRETS:-/srv/fju/status/secrets}/pghero.env
    mem_limit: 384m
    cpus: 0.5
    networks: [fju-status, fju-test]

  # Cloudflare Tunnel：每條 ingress 帶 originRequest.access，隧道端先驗 Access JWT（§3.2a）。
  # config.yml 由 ops/status-render-cloudflared.sh 產生。映像是 nonroot 的 distroless，
  # tunnel.json 是 deploy 600，所以用容器內 root＋只留 DAC_READ_SEARCH 才讀得到。
  cloudflared:
    <<: *common
    image: cloudflare/cloudflared:2026.10.0
    command: ['tunnel', '--no-autoupdate', '--config', '/etc/cloudflared/config.yml', 'run']
    user: '0:0'
    volumes:
      - ./ops/status/cloudflared.yml:/etc/cloudflared/config.yml:ro
      - ${FJU_STATUS_SECRETS:-/srv/fju/status/secrets}/tunnel.json:/etc/cloudflared/tunnel.json:ro
    read_only: true
    cap_drop: [ALL]
    cap_add: [DAC_READ_SEARCH]
    mem_limit: 128m
    cpus: 0.25
    networks: [fju-status]

networks:
  fju-status:
    name: fju-status
  fju-status-docker:
    name: fju-status-docker
    internal: true
  # 測試站 Postgres 所在（COMPOSE_PROJECT_NAME=fju-test 的預設網路），由主網站的 compose 建立。
  fju-test:
    external: true
    name: fju-test_default

volumes:
  gatus_data:
  beszel_data:
  beszel_socket:
    name: beszel_socket
  beszel_agent_data:
    name: beszel_agent_data
