# 故障演練的本機模擬站（票 28）。只給 ops/fault-drill-local.sh 用，不要直接下 docker compose。
#
# 目的：Roy 在 VM 測試站實跑 ops/fault-drill.sh 之前，先在自己的電腦用**同一支腳本、同一個映像**
# 把演練跑一遍。
#
# 這份**疊在 docker-compose.yml 上面**用（跟 VM 的 docker-compose.vm.yml 一樣的疊法），
# 所以站台上會咬人的東西這裡都有：worker／app 依賴 migrate（service_completed_successfully）、
# 映像沒設 APP_IMAGE 時會退回 `ghcr.io/roy4222/fju-web:local` 並試著 build。
# （票 28 第一版的模擬站是獨立檔，沒有這兩點，所以 VM 上 worker-stall、disk80 的錯在本機重現不出來。）
#
# 基礎檔裡寫死的名字全部換成 fju-faultsim-*，不會撞到本機開發的 fju-postgres：
#   - project：一律用 `-p fju-faultsim`（fault-drill.sh 會 export COMPOSE_PROJECT_NAME=fju-test，只有 -p 蓋得過）
#   - 容器：fju-faultsim-postgres／-migrate／-app／-worker；caddy 與 backup 不啟動
#   - volume：fju-faultsim-pgdata、fju-faultsim-files 等
#   - postgres 不發布 port；app 只綁 127.0.0.1:${FAULTSIM_PORT:-3928}
#
# 密碼是固定的假值：這個站只活在本機、跑完 ops/fault-drill-local.sh 就整個刪掉。

x-app-env: &app-env
  DATABASE_URL: postgres://fju_app:faultsim_app@postgres:5432/fju
  BETTER_AUTH_SECRET: faultsim-only-secret-faultsim-only-secret
  BETTER_AUTH_URL: http://127.0.0.1:${FAULTSIM_PORT:-3928}
  GOOGLE_CLIENT_ID: faultsim-disabled
  GOOGLE_CLIENT_SECRET: faultsim-disabled
  FILES_ROOT: /srv/fju/files
  FILE_MAX_BYTES: '104857600'
  # 跟測試站一樣：模擬業務鐘開著，test_noop（毒事件演練用）才有處理器。
  BUSINESS_CLOCK_OVERRIDE_ENABLED: 'true'

services:
  postgres:
    container_name: fju-faultsim-postgres
    environment:
      POSTGRES_USER: fju_owner
      POSTGRES_PASSWORD: faultsim_owner
      POSTGRES_DB: fju

  migrate:
    container_name: fju-faultsim-migrate
    env_file: !reset []
    environment:
      DATABASE_URL_OWNER: postgres://fju_owner:faultsim_owner@postgres:5432/fju

  app:
    container_name: fju-faultsim-app
    env_file: !reset []
    environment: *app-env
    ports:
      - '127.0.0.1:${FAULTSIM_PORT:-3928}:3000'
    volumes:
      - fju-faultsim-files:/srv/fju/files

  worker:
    container_name: fju-faultsim-worker
    env_file: !reset []
    environment: *app-env
    volumes:
      - fju-faultsim-files:/srv/fju/files

  caddy:
    profiles: ['never']
    container_name: fju-faultsim-unused-caddy
    ports: !reset []

  backup:
    profiles: ['never']
    container_name: fju-faultsim-unused-backup
    env_file: !reset []

volumes:
  fju-pgdata:
    name: fju-faultsim-pgdata
  fju-caddy-data:
    name: fju-faultsim-unused-caddy-data
  fju-caddy-config:
    name: fju-faultsim-unused-caddy-config
  fju-backups:
    name: fju-faultsim-unused-backups
  fju-faultsim-files:
    name: fju-faultsim-files
