packages:
  - prototype
  - web

# 虛擬 store 在根目錄，套件的型別要往上找得到 @types/*（否則 next-themes 等會失去 React 型別）
publicHoistPattern:
  - '@types/*'

# 跑 dev／lint 前不要自動 pnpm install（會被 allowBuilds 擋下）
verifyDepsBeforeRun: false

# 每個會跑 build script 的套件都要明講 true／false，否則 pnpm install 會失敗。
# prisma 與 better-sqlite3 是 @better-auth/cli（只用來產 schema）帶進來的，我們不用它們的原生建置。
allowBuilds:
  '@parcel/watcher': false
  '@prisma/client': false
  '@prisma/engines': false
  better-sqlite3: false
  esbuild: true
  prisma: false
  sharp: false
  unrs-resolver: false
  workerd: true

# eslint 9.39.5 鎖的 @eslint/eslintrc 帶的 js-yaml 有 GHSA-2883-xcg3-v3hh（high）。
# 4.3.2 起修好且 API 相容，直接 override 掉整個 workspace 的解析結果。
overrides:
  js-yaml: '^4.3.2'
  # ajv 鎖的 fast-uri 3.1.x 有四件 high（GHSA-5jgf-p345-68v8、GHSA-f65p-4m7j-42xc、
  # GHSA-fph4-wmhf-6fwf、GHSA-jqff-g426-hqxp），3.1.6 起修好且同為 3.x API。
  # 受影響路徑目前全在 prototype/（react-server-dom-webpack>webpack>schema-utils>ajv
  # 與 shadcn CLI），web/ 沒有 fast-uri 路徑，override 對 web/ 的解析結果沒有變化。
  fast-uri: '^3.1.6'
  # 2026-10-09 T12：以下是 web/ 開發期或執行期可達的 high／critical，版號取 pnpm audit 的 patched 下界。
  # next 16.3.8 鎖 sharp ^0.35.4，0.35.4 有 GHSA-wq5f-xc86-pv6w（librsvg），0.35.5 起修好。
  sharp: '^0.35.5'
  # vitest 3.2.x 鎖 tinypool ^1.1.1，有 GHSA-5gmw-xhrv-c9v3、GHSA-85c8-ppgw-ccpr（critical），2.1.2 起修好。
  tinypool: '^2.1.2'
  # eslint-plugin-boundaries 7.2.0 釘 handlebars 4.7.9，有 GHSA-8r5x-fm3f-whwj、GHSA-p8wg-vrv2-v86f（critical）。
  handlebars: '^4.7.10'
  # eslint／typescript-estree 的 minimatch 帶 brace-expansion 1.1.18 與 5.0.9：
  # GHSA-qhr7-859c-m2p7、GHSA-6j4f-fj2g-mc7p（high），兩條主線各自升到修好的 patch。
  brace-expansion@<2: '^1.1.21'
  brace-expansion@>=4 <6: '^5.0.12'
  # postcss 帶的 source-map-js 1.2.1 有 GHSA-68fv-2mgg-jv7q（high），1.2.2 起修好。
  source-map-js: '^1.2.2'
