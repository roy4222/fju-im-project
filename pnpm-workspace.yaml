packages:
  - prototype
  - web

# 虛擬 store 在根目錄，套件的型別要往上找得到 @types/*（否則 next-themes 等會失去 React 型別）
publicHoistPattern:
  - '@types/*'

# 跑 dev／lint 前不要自動 pnpm install（會被 allowBuilds 擋下）
verifyDepsBeforeRun: false

allowBuilds:
  '@parcel/watcher': false
  '@prisma/client': set this to true or false
  '@prisma/engines': set this to true or false
  better-sqlite3: set this to true or false
  esbuild: true
  prisma: set this to true or false
  sharp: false
  unrs-resolver: false
  workerd: true
